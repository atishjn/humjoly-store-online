            if (!matchVid) return false;
          }
          if (selectedCategory !== 'ALL' && p.category !== selectedCategory) return false;
          if (selectedBrand !== 'ALL' && p.brand !== selectedBrand) return false;
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            return (
              p.name.toLowerCase().includes(q) || 
              p.fabricType.toLowerCase().includes(q) || 
              p.sku.toLowerCase().includes(q) ||
              (p.brand && p.brand.toLowerCase().includes(q))
            );
          }
          return true;
        });
      }, [products, catalogViewFilterMode, selectedVideo, selectedCategory, selectedBrand, searchQuery]);

      const totalRevenue = useMemo(() => orders.reduce((sum, o) => sum + (o.amountPaid || 0), 0), [orders]);
      const pendingPayment = useMemo(() => orders.reduce((sum, o) => sum + (o.balanceAmount || 0), 0), [orders]);
      const readyToDispatchCount = useMemo(() => orders.filter(o => o.orderStatus === 'READY_TO_DISPATCH').length, [orders]);
      const lowStockCount = useMemo(() => products.filter(p => p.currentStock <= p.lowStockThreshold).length, [products]);

      return (
        <div class="min-h-screen flex flex-col bg-myntra-bg text-slate-800">
          
          {/* ANNOUNCEMENT BAR */}
          {storeSettings.announcementBar && (
            <div class="bg-myntra-pink text-white text-center text-xs font-semibold py-2 px-4 shadow-sm">
              {storeSettings.announcementBar}
            </div>
          )}

          {/* CLEAN PUBLIC HEADER (HIDDEN OMS ACCESS) */}
          <header class="sticky top-0 z-40 bg-white border-b border-myntra-border px-4 lg:px-8 py-3.5 flex items-center justify-between gap-4 shadow-xs">
            <div class="flex items-center space-x-3 cursor-pointer" onClick={() => setViewMode('store')}>
              <div class="w-10 h-10 rounded-xl overflow-hidden border border-slate-200 shadow-xs flex items-center justify-center bg-slate-100">
                <img src={storeSettings.youtubeAvatar} alt="Logo" class="w-full h-full object-cover" onError={(e)=>{e.target.style.display='none';}} />
                <span class="font-heading font-extrabold text-myntra-pink text-sm">HT</span>
              </div>
              <div>
                <div class="flex items-center space-x-1.5">
                  <h1 class="font-heading font-extrabold text-lg text-slate-900 leading-tight tracking-tight">
                    {storeSettings.storeName}
                  </h1>
                  <span class="text-xs text-blue-600">✓</span>
                </div>
                <p class="text-[10px] text-slate-500 font-semibold tracking-wider uppercase">{storeSettings.tagline}</p>
              </div>
            </div>

            <div class="flex items-center space-x-3">
              {viewMode === 'store' ? (
                <>
                  <button 
                    onClick={() => setShowCartDrawer(true)}
                    class="relative bg-myntra-pink hover:bg-myntra-pinkHover text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-2 shadow-xs"
                  >
                    <span>🛒 Bag / Cart</span>
                    {cart.length > 0 && (
                      <span class="bg-white text-myntra-pink text-[10px] font-extrabold px-1.5 py-0.5 rounded-full shadow-xs">
                        {cart.reduce((s,i)=>s+i.qty,0)}
                      </span>
                    )}
                  </button>

                  <a 
                    href={`https://wa.me/${storeSettings.whatsappPhone}?text=Hi%20Humjoly%20Tailors%2C%20I%20want%20to%20enquire%20about%20fabric%20collections`}
                    target="_blank"
                    rel="noreferrer"
                    class="hidden md:flex items-center space-x-2 bg-emerald-50 text-myntra-emerald hover:bg-emerald-100 px-3.5 py-2 rounded-xl border border-emerald-200 text-xs font-bold transition"
                  >
                    <span class="w-2 h-2 rounded-full bg-myntra-emerald animate-pulse"></span>
                    <span>WhatsApp Line</span>
                  </a>
                </>
              ) : (
                /* ADMIN OMS LOGOUT BUTTON */
                <button 
                  onClick={handleAdminLogout}
                  class="bg-slate-900 hover:bg-slate-800 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-xs flex items-center space-x-1.5"
                >
                  <span>🚪 Admin Logout</span>
                </button>
              )}
            </div>
          </header>

          {/* MAIN BODY VIEW */}
          {viewMode === 'store' ? (
            <StorefrontView 
              products={filteredProducts}
              allProducts={products}
              storeSettings={storeSettings}
              brandsList={brandsList}
              categoriesList={categoriesList}
              catalogViewFilterMode={catalogViewFilterMode}
              setCatalogViewFilterMode={setCatalogViewFilterMode}
              selectedVideo={selectedVideo}
              setSelectedVideo={setSelectedVideo}
              selectedCategory={selectedCategory}
              setSelectedCategory={setSelectedCategory}
              selectedBrand={selectedBrand}
              setSelectedBrand={setSelectedBrand}
              searchQuery={searchQuery}
              setSearchQuery={setSearchQuery}
              onSelectProductPdp={openPdpModal}
              onAddToCart={(prod) => addToCart(prod, 1)}
              onQuickWhatsapp={(prod) => {
                setWhatsappModalProduct(prod);
                setOrderQtyModal(1);
                window.history.pushState({ modal: 'whatsapp' }, '', '#order');
              }}
              onOpenAdminModal={() => setShowAdminLoginModal(true)}
              videosList={videosList}
            />
          ) : (
            <OmsView 
              activeTab={activeTab}
              setActiveTab={setActiveTab}
              orders={orders}
              saveOrdersState={saveOrdersState}
              products={products}
              saveProductsState={saveProductsState}
              storeSettings={storeSettings}
              saveSettingsState={saveSettingsState}
              brandsList={brandsList}
              categoriesList={categoriesList}
              videosList={videosList}
              addDynamicBrand={addDynamicBrand}
              addDynamicCategory={addDynamicCategory}
              addDynamicVideo={addDynamicVideo}
              deleteDynamicVideo={deleteDynamicVideo}
              adminUsers={adminUsers}
              saveAdminUsersState={saveAdminUsersState}
              currentLoggedInUser={currentLoggedInUser}
              totalRevenue={totalRevenue}
              pendingPayment={pendingPayment}
              readyToDispatchCount={readyToDispatchCount}
              lowStockCount={lowStockCount}
              setSelectedOrderForDrawer={setSelectedOrderForDrawer}
              setEditingOrder={setEditingOrder}
              setDeletingOrderId={setDeletingOrderId}
              setEditingProductRow={setEditingProductRow}
              setStockAdjustProduct={setStockAdjustProduct}
            />
          )}

          {/* DUAL ADMIN LOGIN MODAL */}
          {showAdminLoginModal && (
            <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <form onSubmit={handleVerifyAuth} class="bg-white border border-slate-200 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-xl">
                <div class="text-center space-y-1">
                  <div class="w-12 h-12 rounded-2xl bg-pink-100 mx-auto flex items-center justify-center text-myntra-pink text-2xl font-bold">🔒</div>
                  <h3 class="font-heading font-extrabold text-lg text-slate-900">Admin Authentication</h3>
                  <p class="text-xs text-slate-500">Master PIN or Approved Staff Credentials</p>
                </div>

                <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-bold">
                  <button type="button" onClick={() => setAuthModeTab('pin')} class={`flex-1 py-1.5 rounded-lg ${authModeTab === 'pin' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500'}`}>🔑 PIN Access</button>
                  <button type="button" onClick={() => setAuthModeTab('email')} class={`flex-1 py-1.5 rounded-lg ${authModeTab === 'email' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500'}`}>📧 Email Login</button>
                </div>

                {authModeTab === 'pin' ? (
                  <input 
                    type="password" 
                    placeholder="Enter 4-Digit Security PIN" 
                    value={pinInput} 
                    onChange={e => setPinInput(e.target.value)} 
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-center text-lg font-bold tracking-widest text-slate-900 focus:outline-none focus:border-myntra-pink" 
                    autoFocus 
                  />
                ) : (
                  <div class="space-y-2 text-xs">
                    <div><label class="text-slate-600 font-semibold">Email Address</label><input type="email" required value={emailInput} onChange={e=>setEmailInput(e.target.value)} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold text-slate-900" /></div>
                    <div><label class="text-slate-600 font-semibold">Password</label><input type="password" required value={passwordInput} onChange={e=>setPasswordInput(e.target.value)} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold text-slate-900" /></div>
                  </div>
                )}

                <button type="submit" class="w-full bg-myntra-pink hover:bg-myntra-pinkHover text-white font-bold py-3 rounded-xl text-xs shadow-xs">
                  Unlock OMS Admin Portal
                </button>
                <button type="button" onClick={() => setShowAdminLoginModal(false)} class="w-full text-xs text-slate-500 font-medium">Cancel</button>
              </form>
            </div>
          )}

          {/* SUB-ADMIN ONBOARDING REGISTRATION MODAL (`?invite=staff`) */}
          {showInviteRegistrationModal && (
            <div class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-4">
              <div class="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div class="text-center space-y-1">
                  <div class="w-12 h-12 rounded-2xl bg-emerald-100 mx-auto flex items-center justify-center text-emerald-700 text-2xl font-bold">🔗</div>
                  <h3 class="font-heading font-extrabold text-lg text-slate-900">Staff Sub-Admin Invitation</h3>
                  <p class="text-xs text-slate-500">Register your credentials for Master Admin approval.</p>
                </div>

                {!inviteSubmittedToast ? (
                  <form onSubmit={handleRegisterStaffInvite} class="space-y-3 text-xs">
                    <div><label class="text-slate-600 font-semibold">Full Name *</label><input type="text" required value={inviteName} onChange={e=>setInviteName(e.target.value)} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold" /></div>
                    <div><label class="text-slate-600 font-semibold">Gmail / Email Address *</label><input type="email" required value={inviteEmail} onChange={e=>setInviteEmail(e.target.value)} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold" /></div>
                    <div><label class="text-slate-600 font-semibold">Password *</label><input type="password" required value={invitePass} onChange={e=>setInvitePass(e.target.value)} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold" /></div>
                    <div><label class="text-slate-600 font-semibold">Desired 4-Digit Security PIN *</label><input type="password" required maxLength="4" value={invitePin} onChange={e=>setInvitePin(e.target.value)} placeholder="e.g. 5560" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono font-bold tracking-widest text-center text-lg" /></div>
                    <button type="submit" class="w-full bg-myntra-pink hover:bg-myntra-pinkHover text-white font-bold py-3 rounded-xl text-xs shadow-xs">
                      Submit Account for Master Approval 🚀
                    </button>
                  </form>
                ) : (
                  <div class="text-center py-6 space-y-3">
                    <div class="text-emerald-600 font-bold text-base">Registration Submitted! ✓</div>
                    <p class="text-xs text-slate-500">Your account status is currently <b>PENDING_APPROVAL</b>. Once Master Admin approves your request, you can log in using your 4-digit PIN.</p>
                    <button onClick={() => setShowInviteRegistrationModal(false)} class="bg-slate-900 text-white font-bold px-4 py-2 rounded-xl text-xs">Close</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* PDP MODAL */}
          {selectedPdpProduct && (
            <ProductDetailPageModal 
              product={selectedPdpProduct}
              storeSettings={storeSettings}
              onClose={closePdpModal}
              onAddToCart={(prod, qty) => {
                addToCart(prod, qty);
                closePdpModal();
              }}
            />
          )}

          {/* CART DRAWER */}
          {showCartDrawer && (
            <CartDrawer 
              cart={cart}
              storeSettings={storeSettings}
              updateCartQty={updateCartQty}
              onClose={closeCartDrawer}
              onClearCart={() => { setCart([]); localStorage.removeItem('ht_cart'); }}
            />
          )}

          {/* QUICK WHATSAPP MODAL */}
          {whatsappModalProduct && (
            <WhatsAppModal 
              product={whatsappModalProduct}
              qty={orderQtyModal}
              setQty={setOrderQtyModal}
              storeSettings={storeSettings}
              onClose={() => setWhatsappModalProduct(null)}
            />
          )}

          {/* ORDER DETAILS DRAWER */}
          {selectedOrderForDrawer && (
            <OrderDetailsDrawer 
              order={selectedOrderForDrawer}
              onClose={() => setSelectedOrderForDrawer(null)}
              onEdit={(order) => { setSelectedOrderForDrawer(null); setEditingOrder(order); }}
              onDelete={(orderId) => setDeletingOrderId(orderId)}
              onUpdateStatus={(updatedOrder) => {
                const updated = orders.map(o => o.id === updatedOrder.id ? updatedOrder : o);
                saveOrdersState(updated);
                setSelectedOrderForDrawer(updatedOrder);
              }}
            />
          )}

          {/* EDIT ORDER MODAL */}
          {editingOrder && (
            <EditOrderModal 
              order={editingOrder}
              onClose={() => setEditingOrder(null)}
              onSave={(updatedOrder) => {
                const updated = orders.map(o => o.id === updatedOrder.id ? updatedOrder : o);
                saveOrdersState(updated);
                setEditingOrder(null);
              }}
            />
          )}

          {/* CONFIRM DELETE ORDER MODAL */}
          {deletingOrderId && (
            <div class="fixed inset-0 z-60 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-4">
              <div class="bg-white border border-slate-200 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl text-center">
                <div class="w-12 h-12 rounded-2xl bg-red-100 mx-auto flex items-center justify-center text-red-600 text-2xl font-bold">🗑️</div>
                <h3 class="font-heading font-extrabold text-lg text-slate-900">Delete Order Permanently?</h3>
                <p class="text-xs text-slate-500">Are you sure you want to delete order <b>#{deletingOrderId}</b>? This action cannot be undone.</p>
                <div class="flex space-x-2 pt-2">
                  <button onClick={() => setDeletingOrderId(null)} class="flex-1 bg-slate-100 text-slate-700 font-bold py-2.5 rounded-xl text-xs">Cancel</button>
                  <button onClick={() => handleDeleteOrder(deletingOrderId)} class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-xs">Delete Order</button>
                </div>
              </div>
            </div>
          )}

          {/* EDIT PRODUCT ROW MODAL */}
          {editingProductRow && (
            <EditProductModal 
              product={editingProductRow}
              brandsList={brandsList}
              categoriesList={categoriesList}
              videosList={videosList}
              addDynamicBrand={addDynamicBrand}
              addDynamicCategory={addDynamicCategory}
              addDynamicVideo={addDynamicVideo}
              onClose={() => setEditingProductRow(null)}
              onSave={(updatedProduct) => {
                const updated = products.map(p => p.id === updatedProduct.id ? updatedProduct : p);
                saveProductsState(updated);
                setEditingProductRow(null);
              }}
            />
          )}

          {/* STOCK ADJUST MODAL */}
          {stockAdjustProduct && (
            <StockAdjustModal 
              product={stockAdjustProduct}
              onClose={() => setStockAdjustProduct(null)}
              onAdjust={(productId, delta) => {
                const updated = products.map(p => p.id === productId ? { ...p, currentStock: Math.max(0, p.currentStock + delta) } : p);
                saveProductsState(updated);
                setStockAdjustProduct(null);
              }}
            />
          )}

        </div>
      );
    }

    // ==========================================
    // STOREFRONT VIEW (CLEAN PUBLIC USER PAGE)
    // ==========================================
    function StorefrontView({ 
      products, 
      allProducts, 
      storeSettings,
      brandsList,
      categoriesList,
      videosList,
      catalogViewFilterMode,
      setCatalogViewFilterMode,
      selectedVideo, 
      setSelectedVideo,
      selectedCategory, 
      setSelectedCategory,
      selectedBrand, 
      setSelectedBrand,
      searchQuery,
      setSearchQuery,
      onSelectProductPdp,
      onAddToCart,
      onQuickWhatsapp,
      onOpenAdminModal
    }) {
      const videoOptions = videosList && videosList.length > 0 ? videosList : ['Video no 18', 'Video no 13', 'Video no 14', 'Video no 15', 'Video no 16', 'Video no 17', 'Video no 11'];

      return (
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
          
          {/* HERO COVER */}
          <div class="relative overflow-hidden rounded-3xl bg-white border border-myntra-border p-6 sm:p-8 shadow-xs flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="space-y-3 max-w-2xl">
              <div class="inline-flex items-center space-x-2 bg-pink-50 border border-pink-200 px-3 py-1 rounded-full text-myntra-pink text-xs font-bold uppercase">
                <span>🎥 YouTube Collection Hub + Standalone Catalog</span>
              </div>
              <h2 class="text-2xl sm:text-4xl font-heading font-extrabold text-slate-900 leading-tight">
                {storeSettings.heroTitle}
              </h2>
              <p class="text-slate-600 text-xs sm:text-sm leading-relaxed">
                {storeSettings.heroSubtitle}
              </p>
            </div>

            <div class="w-28 h-28 rounded-2xl overflow-hidden border border-slate-200 shadow-xs shrink-0 bg-slate-100">
              <img src={storeSettings.youtubeAvatar} alt="Avatar" class="w-full h-full object-cover" />
            </div>
          </div>

          {/* DEDICATED CATALOG SELECTION */}
          <div class="bg-white border border-myntra-border rounded-2xl p-4 space-y-4 shadow-xs">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-3">
              <span class="text-xs font-extrabold text-slate-900 uppercase">Catalogue Browsing Mode:</span>
              <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-bold">
                <button 
                  onClick={() => { setCatalogViewFilterMode('ALL'); setSelectedVideo('ALL'); }}
                  class={`px-4 py-1.5 rounded-lg transition ${catalogViewFilterMode === 'ALL' ? 'bg-myntra-pink text-white shadow-xs' : 'text-slate-600'}`}
                >
                  🌐 Full Standalone Catalog ({allProducts.filter(p=>p.isActive).length})
                </button>
                <button 
                  onClick={() => { setCatalogViewFilterMode('VIDEO'); setSelectedVideo('Video no 18'); }}
                  class={`px-4 py-1.5 rounded-lg transition ${catalogViewFilterMode === 'VIDEO' ? 'bg-myntra-pink text-white shadow-xs' : 'text-slate-600'}`}
                >
                  🎥 Filter by YouTube Video
                </button>
              </div>
            </div>

            {catalogViewFilterMode === 'VIDEO' && (
              <div class="flex items-center space-x-2 overflow-x-auto pb-1 custom-scrollbar">
                <span class="text-xs font-bold text-red-600 shrink-0 mr-1">Select Video:</span>
                {videoOptions.map(vid => (
                  <button
                    key={vid}
                    onClick={() => setSelectedVideo(vid)}
                    class={`px-3 py-1.5 rounded-full text-xs font-bold shrink-0 transition ${selectedVideo === vid ? 'bg-red-600 text-white' : 'bg-red-50 text-red-700 border border-red-200'}`}
                  >
                    ▶ {vid}
                  </button>
                ))}
              </div>
            )}

            <div class="relative">
              <input 
                type="text"
                placeholder="Search suiting & shirting fabrics (e.g. Soktas, Raymond, Linen)..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 pl-10 text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:border-myntra-pink"
              />
              <span class="absolute left-3.5 top-3 text-slate-400 text-xs">🔍</span>
            </div>

            <div class="space-y-2">
              <div class="flex items-center space-x-2 overflow-x-auto pb-1 custom-scrollbar">
                <span class="text-[11px] font-bold text-slate-400 uppercase shrink-0 mr-1">Category:</span>
                <button 
                  onClick={() => setSelectedCategory('ALL')} 
                  class={`px-3 py-1 rounded-full text-xs font-semibold shrink-0 transition ${selectedCategory === 'ALL' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                >
                  All
                </button>
                {categoriesList.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    class={`px-3 py-1 rounded-full text-xs font-semibold shrink-0 transition ${selectedCategory === cat ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              <div class="flex items-center space-x-2 overflow-x-auto pb-1 custom-scrollbar">
                <span class="text-[11px] font-bold text-slate-400 uppercase shrink-0 mr-1">Brand:</span>
                <button 
                  onClick={() => setSelectedBrand('ALL')} 
                  class={`px-3 py-1 rounded-full text-xs font-semibold shrink-0 transition ${selectedBrand === 'ALL' ? 'bg-amber-500 text-black font-bold' : 'bg-slate-100 text-slate-600'}`}
                >
                  All Brands
                </button>
                {brandsList.map(brand => (
                  <button
                    key={brand}
                    onClick={() => setSelectedBrand(brand)}
                    class={`px-3 py-1 rounded-full text-xs font-semibold shrink-0 transition ${selectedBrand === brand ? 'bg-amber-500 text-black font-bold' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                  >
                    {brand}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* FABRIC GRID */}
          <div class="space-y-4">
            <h3 class="font-heading font-extrabold text-lg text-slate-900">
              Available Fabric Catalog ({products.length})

            {products.length === 0 ? (
              <div class="bg-white border border-slate-200 rounded-2xl p-12 text-center space-y-3 shadow-xs">
                <div class="text-3xl">🔍</div>
                <p class="text-xs text-slate-500">No fabrics match your search query.</p>
                <button onClick={() => { setCatalogViewFilterMode('ALL'); setSelectedVideo('ALL'); setSelectedCategory('ALL'); setSelectedBrand('ALL'); setSearchQuery(''); }} class="text-xs bg-slate-100 px-4 py-2 rounded-xl font-bold text-slate-700">Reset Filters</button>
              </div>
            ) : (
              <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                {products.map(product => (
                  <MyntraProductCard 
                    key={product.id} 
                    product={product} 
                    onClickPdp={() => onSelectProductPdp(product)}
                    onAddToCart={() => onAddToCart(product)}
                    onQuickWhatsapp={() => onQuickWhatsapp(product)} 
                  />
                ))}
              </div>
            )}
          </div>

          {/* DISCRETE FOOTER LINK FOR HIDDEN ADMIN PORTAL */}
          <footer class="pt-12 text-center border-t border-slate-200 pb-6 text-xs text-slate-400">
            <div>© {new Date().getFullYear()} Humjoly Tailors. All Rights Reserved.</div>
            <button onClick={onOpenAdminModal} class="mt-2 text-[10px] text-slate-400 hover:text-slate-600 transition">
              🔒 Shop Owner Admin Portal
            </button>
          </footer>
        </main>
      );
    }

    function MyntraProductCard({ product, onClickPdp, onAddToCart, onQuickWhatsapp }) {
      const discountPercent = product.mrpPrice ? Math.round(((product.mrpPrice - product.sellingPrice) / product.mrpPrice) * 100) : 0;

      return (
        <div class="group bg-white border border-myntra-border rounded-2xl overflow-hidden hover:border-pink-300 hover:shadow-lg transition duration-300 flex flex-col justify-between">
          <div class="relative aspect-square w-full bg-slate-100 overflow-hidden cursor-pointer" onClick={onClickPdp}>
            <img src={product.imageUrl} alt={product.name} class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
            {discountPercent > 0 && (

    function CartDrawer({ cart, storeSettings, updateCartQty, onClose, onClearCart }) {
      const [step, setStep] = useState('cart'); // 'cart' | 'checkout'
      const [custName, setCustName] = useState('');
      const [custPhone, setCustPhone] = useState('');
      const [custAddress, setCustAddress] = useState('');
      const [custPincode, setCustPincode] = useState('');
      const [paymentMode, setPaymentMode] = useState('UPI');
      const [orderNotes, setOrderNotes] = useState('');

      const totalAmount = cart.reduce((sum, item) => sum + (item.product.sellingPrice * item.qty), 0);
      const siteBase = 'https://atishjn.github.io/humjoly-store-online';

      const generateCombinedWhatsapp = () => {
        let msg = `Hi Humjoly Tailors! 🙏 I want to place an order.\n\n`;
        msg += `👤 *Name*: ${custName}\n📞 *Phone*: ${custPhone}\n📍 *Address*: ${custAddress}, Pincode: ${custPincode}\n💳 *Payment*: ${paymentMode}\n\n`;
        msg += `*Order Items:*\n`;
        cart.forEach((item, idx) => {
          const productUrl = `${siteBase}/?sku=${item.product.sku}`;
          msg += `${idx + 1}. *${item.product.name}*\n   SKU: ${item.product.sku}\n   📏 Qty: ${item.qty} ${item.product.unit}\n   💵 ₹${item.product.sellingPrice * item.qty}\n   🔗 ${productUrl}\n`;
        });
        msg += `\n💰 *Total*: ₹${totalAmount}`;
        if (orderNotes) msg += `\n📝 *Notes*: ${orderNotes}`;
        msg += `\n\nPlease confirm availability. Thank you!`;
        return `https://wa.me/${storeSettings.whatsappPhone}?text=${encodeURIComponent(msg)}`;
      };

      return (
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex justify-end">
          <div class="bg-white border-l border-slate-200 max-w-md w-full h-full flex flex-col shadow-2xl">

            {/* HEADER */}
            <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4 shrink-0">
              <div class="flex items-center space-x-3">
                {step === 'checkout' && (
                  <button onClick={() => setStep('cart')} class="text-slate-400 hover:text-slate-900 text-sm">←</button>
                )}
                <h3 class="font-heading font-bold text-lg text-slate-900">
                  {step === 'cart' ? `Your Cart (${cart.reduce((s,i)=>s+i.qty,0)})` : '📋 Order Details'}
                </h3>
              </div>
              <button onClick={onClose} class="text-slate-400 hover:text-slate-900 text-lg">✕</button>
            </div>

            {/* STEP INDICATOR */}
            <div class="flex border-b border-slate-100 text-[10px] font-bold">
              <div class={`flex-1 py-2 text-center ${step === 'cart' ? 'text-myntra-pink border-b-2 border-myntra-pink' : 'text-slate-400'}`}>1. CART REVIEW</div>
              <div class={`flex-1 py-2 text-center ${step === 'checkout' ? 'text-myntra-pink border-b-2 border-myntra-pink' : 'text-slate-400'}`}>2. YOUR DETAILS</div>
            </div>

            {/* SCROLL BODY */}
            <div class="flex-1 overflow-y-auto custom-scrollbar px-6 py-4">
              {step === 'cart' ? (
                <div class="space-y-3">
                  {cart.length === 0 ? (
                    <div class="text-center py-12 text-slate-400 text-xs">Your cart is empty.</div>
                  ) : (
                    cart.map((item) => (
                      <div key={item.product.id} class="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex space-x-3 items-center justify-between">
                        <img src={item.product.imageUrl} class="w-14 h-14 rounded-xl object-cover" />
                        <div class="flex-1 min-w-0">
                          <h4 class="font-heading font-bold text-xs text-slate-900 truncate">{item.product.name}</h4>
                          <div class="text-[10px] text-slate-400 font-mono">{item.product.sku}</div>
                          <div class="text-xs text-myntra-pink font-semibold mt-0.5">₹{item.product.sellingPrice} / {item.product.unit}</div>
                        </div>
                        <div class="flex items-center space-x-2 bg-white px-2 py-1 rounded-lg border border-slate-200">
                          <button onClick={() => updateCartQty(item.product.id, item.qty - 1)} class="text-slate-900 font-bold px-1 text-xs">-</button>
                          <span class="text-xs font-bold text-slate-900 w-4 text-center">{item.qty}</span>
                          <button onClick={() => updateCartQty(item.product.id, item.qty + 1)} class="text-slate-900 font-bold px-1 text-xs">+</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              ) : (
                <div class="space-y-3 text-xs">
                  <p class="text-slate-500">Fill in your details. These will be sent along with your order on WhatsApp.</p>
                  <div><label class="text-slate-700 font-semibold">Full Name *</label><input type="text" required value={custName} onChange={e=>setCustName(e.target.value)} placeholder="e.g. Ramesh Kumar" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold mt-1" /></div>
                  <div><label class="text-slate-700 font-semibold">Phone Number *</label><input type="tel" required value={custPhone} onChange={e=>setCustPhone(e.target.value)} placeholder="e.g. 9885612345" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono mt-1" /></div>
                  <div><label class="text-slate-700 font-semibold">Delivery Address *</label><textarea required value={custAddress} onChange={e=>setCustAddress(e.target.value)} placeholder="House No, Street, Colony, City, State" rows={2} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 mt-1 resize-none" /></div>
                  <div><label class="text-slate-700 font-semibold">Pincode *</label><input type="text" required maxLength={6} value={custPincode} onChange={e=>setCustPincode(e.target.value)} placeholder="e.g. 500001" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono mt-1" /></div>
                  <div>
                    <label class="text-slate-700 font-semibold">Payment Option (UPI ONLY, NO COD)</label>
                    <div class="flex space-x-2 mt-1">
                      {['UPI (GPay / PhonePe / Paytm)', 'Bank Transfer / QR'].map(opt => (
                        <button key={opt} type="button" onClick={()=>setPaymentMode(opt)} class={`flex-1 py-2 rounded-xl text-[11px] font-bold border transition ${paymentMode===opt ? 'bg-myntra-pink text-white border-transparent' : 'bg-slate-50 text-slate-600 border-slate-300'}`}>{opt}</button>
                      ))}
                    </div>
                  </div>
                  <div><label class="text-slate-700 font-semibold">Order Notes (optional)</label><input type="text" value={orderNotes} onChange={e=>setOrderNotes(e.target.value)} placeholder="Any special instructions?" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 mt-1" /></div>
                </div>
              )}
            </div>

            {/* FOOTER */}
            {cart.length > 0 && (
              <div class="border-t border-slate-200 px-6 py-4 space-y-3 shrink-0">
                <div class="flex justify-between items-baseline">
                  <span class="text-xs text-slate-500 font-medium">Total Order Value:</span>
                  <span class="text-xl font-extrabold text-slate-900 font-heading">₹{totalAmount}</span>
                </div>
                {step === 'cart' ? (
                  <button onClick={() => setStep('checkout')} class="w-full bg-myntra-pink hover:bg-myntra-pinkHover text-white font-bold py-3.5 rounded-xl text-xs shadow-xs">
                    Proceed to Order Details →
                  </button>
                ) : (
                  <a
                    href={custName && custPhone && custAddress && custPincode ? generateCombinedWhatsapp() : '#'}
                    onClick={e => { if (!custName || !custPhone || !custAddress || !custPincode) { e.preventDefault(); alert('Please fill in all required fields!'); } }}
                    target="_blank" rel="noreferrer"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl text-center block text-xs shadow-xs"
                  >
                    Send Order on WhatsApp 🚀
                  </a>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    function WhatsAppModal({ product, qty, setQty, storeSettings, onClose }) {
      const [custName, setCustName] = useState('');
      const [custPhone, setCustPhone] = useState('');
      const [custAddress, setCustAddress] = useState('');
      const totalPrice = product.sellingPrice * qty;
      const siteBase = 'https://atishjn.github.io/humjoly-store-online';
      const productUrl = `${siteBase}/?sku=${product.sku}`;

      const buildWhatsappUrl = () => {
        let msg = `Hi Humjoly Tailors! 🙏 I want to order:\n\n`;
        msg += `👤 *Name*: ${custName}\n📞 *Phone*: ${custPhone}\n`;
        if (custAddress) msg += `📍 *Address*: ${custAddress}\n`;
        msg += `\n🧵 *Product*: ${product.name}\n🔖 *SKU*: ${product.sku}\n📏 *Qty*: ${qty} ${product.unit}\n💵 *Total*: ₹${totalPrice}\n🔗 *Product Link*: ${productUrl}\n\nPlease confirm availability. Thank you!`;
        return `https://wa.me/${storeSettings.whatsappPhone}?text=${encodeURIComponent(msg)}`;
      };

      return (
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div class="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between border-b border-slate-200 pb-3">
              <h3 class="font-heading font-bold text-lg text-slate-900">💬 Quick WhatsApp Order</h3>
              <button onClick={onClose} class="text-slate-400">✕</button>
            </div>

            <div class="flex space-x-3 bg-slate-50 p-3 rounded-2xl border border-slate-200 items-center">
              <img src={product.imageUrl} class="w-14 h-14 rounded-xl object-cover" />
              <div class="flex-1">
                <h4 class="font-heading font-bold text-xs text-slate-900">{product.name}</h4>
                <p class="text-xs text-myntra-pink font-semibold mt-0.5">₹{product.sellingPrice} / {product.unit}</p>
                <div class="flex items-center space-x-2 mt-1.5">
                  <button onClick={() => setQty(Math.max(1, qty - 1))} class="w-6 h-6 bg-slate-200 rounded-lg text-xs font-bold">-</button>
                  <span class="text-xs font-bold text-slate-900 w-5 text-center">{qty}</span>
                  <button onClick={() => setQty(qty + 1)} class="w-6 h-6 bg-slate-200 rounded-lg text-xs font-bold">+</button>
                  <span class="text-xs text-slate-500">=  ₹{totalPrice}</span>
                </div>
              </div>
            </div>

            <div class="space-y-2 text-xs">
              <div><label class="text-slate-700 font-semibold">Your Name *</label><input type="text" value={custName} onChange={e=>setCustName(e.target.value)} placeholder="Full Name" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold mt-1" /></div>
              <div><label class="text-slate-700 font-semibold">Phone Number *</label><input type="tel" value={custPhone} onChange={e=>setCustPhone(e.target.value)} placeholder="10-digit Mobile Number" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono mt-1" /></div>
              <div><label class="text-slate-700 font-semibold">Delivery Address (optional)</label><input type="text" value={custAddress} onChange={e=>setCustAddress(e.target.value)} placeholder="City, State" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 mt-1" /></div>
            </div>

            <a
              href={custName && custPhone ? buildWhatsappUrl() : '#'}
              onClick={e => { if (!custName || !custPhone) { e.preventDefault(); alert('Please enter your Name and Phone number!'); } }}
              target="_blank" rel="noreferrer"
              class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl text-center block text-xs shadow-xs"
            >
              Send Order on WhatsApp 🚀
            </a>
          </div>
        </div>
      );
    }

    // --- EDIT ORDER MODAL ---
    function EditOrderModal({ order, onClose, onSave }) {
      const [form, setForm] = useState({
        ...order,
        customerName: order.customer?.name || order.customerName || '',
        customerPhone: order.customer?.phone || order.phoneNumber || '',
        customerAddress: order.customer?.address || order.address || '',
      });

      const STATUS_OPTIONS = ['PENDING', 'CONFIRMED', 'PROCESSING', 'READY_TO_DISPATCH', 'DISPATCHED', 'DELIVERED', 'CANCELLED'];
      const PAYMENT_STATUS_OPTIONS = ['PENDING', 'PARTIAL', 'PAID', 'REFUNDED'];

      const handleSubmit = (e) => {
        e.preventDefault();
        const totalAmount = Number(form.totalAmount) || 0;
        const amountPaid = Number(form.amountPaid) || 0;
        const balanceAmount = Math.max(0, totalAmount - amountPaid);

        const updated = {
          ...order,
          ...form,
          customer: {
            ...order.customer,
            name: form.customerName,
            phone: form.customerPhone,
            address: form.customerAddress
          },
          totalAmount,
          amountPaid,
          balanceAmount,
          paymentStatus: form.paymentStatus
        };
        onSave(updated);
      };

      return (
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto custom-scrollbar">
          <form onSubmit={handleSubmit} class="bg-white border border-slate-200 rounded-3xl max-w-xl w-full p-6 space-y-4 shadow-2xl my-auto max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex justify-between items-center border-b pb-3">
              <div>
                <h3 class="font-heading font-extrabold text-lg text-slate-900">✏️ Edit Order</h3>
                <p class="text-xs text-slate-500">Order ID: {order.id}</p>
              </div>
              <button type="button" onClick={onClose} class="text-slate-400 hover:text-slate-900 text-xl font-bold">✕</button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
              <div class="sm:col-span-2">
                <label class="text-slate-600 font-semibold">Customer Name *</label>
                <input type="text" required value={form.customerName} onChange={e => setForm({...form, customerName: e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold" />
              </div>
              <div>
                <label class="text-slate-600 font-semibold">Phone *</label>
                <input type="text" required value={form.customerPhone} onChange={e => setForm({...form, customerPhone: e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono" />
              </div>
              <div>
                <label class="text-slate-600 font-semibold">Date</label>
                <input type="text" value={form.date || ''} onChange={e => setForm({...form, date: e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5" />
              </div>
              <div class="sm:col-span-2">
                <label class="text-slate-600 font-semibold">Address</label>
                <textarea value={form.customerAddress} onChange={e => setForm({...form, customerAddress: e.target.value})} rows={2} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 resize-none" />
              </div>
              <div class="sm:col-span-2">
                <label class="text-slate-600 font-semibold">Fabric Description *</label>
                <input type="text" required value={form.fabricDescription || ''} onChange={e => setForm({...form, fabricDescription: e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold" />
              </div>
              <div>
                <label class="text-slate-600 font-semibold">Quantity</label>
                <input type="text" value={form.quantity || ''} onChange={e => setForm({...form, quantity: e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5" />
              </div>
              <div>
                <label class="text-slate-600 font-semibold">Video Attribution</label>
                <input type="text" value={form.videoAttribution || ''} onChange={e => setForm({...form, videoAttribution: e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5" />
              </div>
              <div>
                <label class="text-slate-600 font-semibold">Total Amount (₹) *</label>
                <input type="number" required value={form.totalAmount || ''} onChange={e => setForm({...form, totalAmount: e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold" />
              </div>
              <div>
                <label class="text-slate-600 font-semibold">Amount Paid (₹)</label>
                <input type="number" value={form.amountPaid || ''} onChange={e => setForm({...form, amountPaid: e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold text-emerald-700" />
              </div>
              <div>
                <label class="text-slate-600 font-semibold">Payment Status</label>
                <select value={form.paymentStatus || 'PENDING'} onChange={e => setForm({...form, paymentStatus: e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold">
                  {PAYMENT_STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <div>
                <label class="text-slate-600 font-semibold">Order Status</label>
                <select value={form.orderStatus || 'PENDING'} onChange={e => setForm({...form, orderStatus: e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold">
                  {STATUS_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <div class="sm:col-span-2">
                <label class="text-slate-600 font-semibold">Courier Tracking (Optional)</label>
                <input type="text" value={form.courierTracking || ''} onChange={e => setForm({...form, courierTracking: e.target.value})} placeholder="e.g. Delhivery AWB 123456789" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5" />
              </div>
            </div>

            <div class="flex justify-end space-x-3 border-t pt-4">
              <button type="button" onClick={onClose} class="px-5 py-2.5 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl">Cancel</button>
              <button type="submit" class="px-6 py-2.5 bg-myntra-pink hover:bg-myntra-pinkHover text-white font-bold text-xs rounded-xl shadow-xs">Save Changes ✓</button>
            </div>
          </form>
        </div>
      );

    function EditProductModal({ product, brandsList, categoriesList, videosList, addDynamicBrand, addDynamicCategory, addDynamicVideo, onClose, onSave }) {
      const [form, setForm] = useState({ ...product });
      const [selectedVideos, setSelectedVideos] = useState(
        product.videoCodes || product.featuredInVideos || (product.videoCode ? [product.videoCode] : ['Video no 18'])
      );
      const [newVideoInput, setNewVideoInput] = useState('');
      const [customBrandInput, setCustomBrandInput] = useState('');
      const [isAddingBrand, setIsAddingBrand] = useState(false);
      const [customCategoryInput, setCustomCategoryInput] = useState('');
      const [isAddingCategory, setIsAddingCategory] = useState(false);
      
      const [galleryUrls, setGalleryUrls] = useState(
        product.galleryImages && product.galleryImages.length > 0 ? product.galleryImages : [product.imageUrl]
      );
      const [newGalleryUrlInput, setNewGalleryUrlInput] = useState('');

      const toggleVideoSelection = (vid) => {
        if (selectedVideos.includes(vid)) {
          setSelectedVideos(selectedVideos.filter(v => v !== vid));
        } else {
          setSelectedVideos([...selectedVideos, vid]);
        }
      };

      const handleAddNewVideoTag = () => {
        if (newVideoInput.trim()) {
          const tag = newVideoInput.trim();
          if (addDynamicVideo) addDynamicVideo(tag);
          if (!selectedVideos.includes(tag)) {
            setSelectedVideos([...selectedVideos, tag]);
          }
          setNewVideoInput('');
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => setGalleryUrls([...galleryUrls, evt.target.result]);
        reader.readAsDataURL(file);
      };

      const handleAddUrlToGallery = () => {
        if (newGalleryUrlInput.trim()) {
          setGalleryUrls([...galleryUrls, newGalleryUrlInput.trim()]);
          setNewGalleryUrlInput('');
        }
      };

      const handleRemoveImageThumbnail = (idx) => {
        if (galleryUrls.length <= 1) return alert("Product must keep at least 1 photo!");
        setGalleryUrls(galleryUrls.filter((_, i) => i !== idx));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        let targetBrand = form.brand;
        if (isAddingBrand && customBrandInput.trim()) {
          targetBrand = customBrandInput.trim();
          if (addDynamicBrand) addDynamicBrand(targetBrand);
        }

        let targetCategory = form.category;
        if (isAddingCategory && customCategoryInput.trim()) {
          targetCategory = customCategoryInput.trim();
          if (addDynamicCategory) addDynamicCategory(targetCategory);
        }

        const updated = {
          ...form,
          brand: targetBrand,
          category: targetCategory,
          videoCodes: selectedVideos,
          featuredInVideos: selectedVideos,
          imageUrl: galleryUrls[0] || form.imageUrl,
          galleryImages: galleryUrls
        };
        onSave(updated);
      };

      return (

                    <button type="button" onClick={() => setIsAddingCategory(true)} class="bg-pink-100 text-myntra-pink px-2 py-1 rounded-xl text-xs font-bold">+ Custom</button>

    // --- DIY CUSTOMIZER, MASTER ADMIN PIN & VIDEO MANAGER ---
    function OmsWebsiteCustomizerTab({ storeSettings, saveSettingsState, adminUsers, saveAdminUsersState, videosList, addDynamicVideo, deleteDynamicVideo, currentLoggedInUser }) {
      const isMasterAdmin = currentLoggedInUser?.role === 'Master Admin';
      const [formData, setFormData] = useState(storeSettings);
      const [masterPinInput, setMasterPinInput] = useState(storeSettings.adminPin || '1974');
      const [pinSavedToast, setPinSavedToast] = useState(false);
      const [savedToast, setSavedToast] = useState(false);
      const [inviteLinkCopiedToast, setInviteLinkCopiedToast] = useState(false);
      const [newVideoInput, setNewVideoInput] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        saveSettingsState(formData);
        setSavedToast(true);
        setTimeout(() => setSavedToast(false), 2000);
      };

      const handleUpdateMasterPin = (e) => {
        e.preventDefault();
        if (!masterPinInput || masterPinInput.length < 4) {
          return alert("Security PIN must be 4 digits!");
        }
        const updatedSettings = { ...formData, adminPin: masterPinInput };
        setFormData(updatedSettings);
        saveSettingsState(updatedSettings);

        const updatedUsers = adminUsers.map(u => u.role === 'Master Admin' ? { ...u, pin: masterPinInput } : u);
        saveAdminUsersState(updatedUsers);

        setPinSavedToast(true);
        setTimeout(() => setPinSavedToast(false), 2500);
      };

      const handleAddVideo = (e) => {
        e.preventDefault();
        if (newVideoInput.trim()) {
          if (addDynamicVideo) addDynamicVideo(newVideoInput.trim());
          setNewVideoInput('');
        }
      };

      const handleGenerateInviteLink = () => {
        const url = `${window.location.origin}${window.location.pathname}?invite=staff`;
        navigator.clipboard.writeText(url);
        setInviteLinkCopiedToast(true);
        setTimeout(() => setInviteLinkCopiedToast(false), 2500);
      };

      const handleApproveSubAdmin = (userId) => {
        const updated = adminUsers.map(u => u.id === userId ? { ...u, status: 'APPROVED' } : u);
        saveAdminUsersState(updated);
      };

      const handleRejectSubAdmin = (userId) => {
        const updated = adminUsers.filter(u => u.id !== userId);
        saveAdminUsersState(updated);
      };

      return (
        <div class="space-y-6 max-w-3xl mx-auto">
          
          {/* 🔒 SUPER MASTER ADMIN SECURITY PIN SETTINGS - VISIBLE ONLY TO MASTER ADMIN */}
          {isMasterAdmin && (
          <form onSubmit={handleUpdateMasterPin} class="bg-white border border-slate-200 rounded-3xl p-6 space-y-4 shadow-xs">
            <div class="flex justify-between border-b pb-3 items-center">
              <div>
                <h3 class="font-heading font-extrabold text-lg text-slate-900">🔒 Super Master Admin Security PIN Settings</h3>
                <p class="text-xs text-slate-500">Change your master 4-digit PIN for instant admin login & store access.</p>
              </div>
              {pinSavedToast && <span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-3 py-1 rounded-full">PIN Updated ✓</span>}
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs items-center">
              <div>
                <label class="text-slate-700 font-bold">New 4-Digit Master Security PIN *</label>
                <input 
                  type="text" 
                  required 
                  maxLength="4" 
                  value={masterPinInput} 
                  onChange={e=>setMasterPinInput(e.target.value)} 
                  class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 font-mono font-extrabold text-lg tracking-widest text-center text-slate-900 mt-1" 
                />
              </div>
              <div class="pt-4">
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl text-xs shadow-xs">
                  Update Security PIN ✓
                </button>
              </div>
            </div>
          </form>
          )}

          {/* 🎥 DYNAMIC VIDEO COLLECTION MANAGER */}
          <div class="bg-white border border-slate-200 rounded-3xl p-6 space-y-4 shadow-xs">
            <div class="border-b pb-3">
              <h3 class="font-heading font-extrabold text-lg text-slate-900">🎥 Dynamic Video Numbers Collection Manager</h3>
              <p class="text-xs text-slate-500">Add or remove YouTube video numbers used for fabric catalog tagging.</p>
            </div>

            <form onSubmit={handleAddVideo} class="flex space-x-2 text-xs">
              <input 
                type="text" 
                placeholder="e.g. Video no 21" 
                value={newVideoInput} 
                onChange={e=>setNewVideoInput(e.target.value)} 
                class="flex-1 bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold" 
              />
              <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2.5 rounded-xl shadow-xs">
                + Add Video Tag
              </button>
            </form>

            <div class="flex flex-wrap gap-2 pt-1 text-xs">
              {(videosList || []).map(vid => (
                <div key={vid} class="bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-xl flex items-center space-x-2 font-bold text-slate-800">
                  <span>🎥 {vid}</span>
                  <button 
                    type="button" 
                    onClick={() => { if(confirm(`Delete ${vid}?`)) deleteDynamicVideo(vid); }} 
                    class="text-red-500 hover:text-red-700 text-xs font-bold"
                  >
                    ✕
                  </button>
                </div>
              ))}
            </div>
          </div>

          {/* DIY STOREFRONT CUSTOMIZER */}
          <form onSubmit={handleSubmit} class="bg-white border border-slate-200 rounded-3xl p-6 space-y-4 shadow-xs">
            <div class="flex justify-between border-b pb-3">
              <h3 class="font-heading font-extrabold text-lg text-slate-900">DIY Website Customizer</h3>
              {savedToast && <span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-3 py-1 rounded-full">Saved ✓</span>}
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
              <div><label class="text-slate-600 font-semibold">Store Title</label><input type="text" value={formData.storeName} onChange={e=>setFormData({...formData, storeName:e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold" /></div>
              <div><label class="text-slate-600 font-semibold">WhatsApp Business Phone</label><input type="text" value={formData.whatsappPhone} onChange={e=>setFormData({...formData, whatsappPhone:e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono" /></div>
              <div class="sm:col-span-2"><label class="text-slate-600 font-semibold">Tagline</label><input type="text" value={formData.tagline} onChange={e=>setFormData({...formData, tagline:e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5" /></div>
              <div class="sm:col-span-2"><label class="text-slate-600 font-semibold">Announcement Bar</label><input type="text" value={formData.announcementBar} onChange={e=>setFormData({...formData, announcementBar:e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5" /></div>
            </div>

            <button type="submit" class="w-full bg-myntra-pink text-white font-bold py-3 rounded-xl text-xs shadow-xs">Save Store Customizations</button>
          </form>

          {/* MASTER ADMIN STAFF INVITE LINK & APPROVAL QUEUE */}
          <div class="bg-white border border-slate-200 rounded-3xl p-6 space-y-4 shadow-xs">
            <div class="flex justify-between items-center border-b pb-3">
              <div>
                <h3 class="font-heading font-extrabold text-lg text-slate-900">Sub-Admin Invite & Master Approval Queue</h3>
                <p class="text-xs text-slate-500">Generate staff registration links & approve sub-admin 4-digit PIN access.</p>
              </div>
              <button type="button" onClick={handleGenerateInviteLink} class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-xs">
                {inviteLinkCopiedToast ? 'Copied Invite URL ✓' : '🔗 Generate Staff Invite Link'}
              </button>
            </div>

            <div class="space-y-3 text-xs">
              <h4 class="font-bold text-slate-900 uppercase">Sub-Admin Accounts & Approvals:</h4>
              {adminUsers.map(u => (
                <div key={u.id} class="flex justify-between items-center bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                  <div>
                    <div class="font-bold text-slate-900">{u.name} <span class="text-slate-500">({u.email})</span></div>
                    <div class="text-[10px] text-slate-500">PIN: {u.pin ? '****' : 'N/A'} | Status: <b class={u.status === 'APPROVED' ? 'text-emerald-600' : 'text-amber-600'}>{u.status}</b></div>
                  </div>

                  {u.status === 'PENDING_APPROVAL' ? (
                    <div class="flex space-x-1.5">
                      <button onClick={() => handleApproveSubAdmin(u.id)} class="bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs">
                        ✅ Approve PIN
                      </button>
                      <button onClick={() => handleRejectSubAdmin(u.id)} class="bg-red-600 text-white font-bold px-2.5 py-1.5 rounded-lg text-xs">
                        ✕ Reject
                      </button>
                    </div>
                  ) : (
                    <span class="bg-emerald-100 text-emerald-800 font-bold px-2.5 py-1 rounded-lg text-[10px]">
                      {u.role} ✓
                    </span>
                  )}
                </div>
              ))}
            </div>
          </div>

        </div>
      );
    }

    function OmsCsvImportAndDedupeTab({ orders, saveOrdersState }) {
      const [parsedDiff, setParsedDiff] = useState(null);

      const handleParseCsvText = (csvContent) => {
        const lines = csvContent.split(/\r?\n/).filter(line => line.trim().length > 0);
        if (lines.length <= 1) return;
        const newItems = [];
        const startIdx = lines[0].toUpperCase().includes('NAME') ? 1 : 0;

        for (let i = startIdx; i < lines.length; i++) {
          const cols = lines[i].split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
          if (cols.length < 3) continue;

          const orderObj = {
            id: `HT-${1000 + orders.length + newItems.length + 1}`,
            ie: parseInt(cols[0]) || (orders.length + i),
            date: cols[3] || 'Today',
            customer: { name: cols[1] || 'Customer', phone: cols[2] || '', address: cols[7] || 'Local' },
            videoAttribution: cols[4] || 'Video no 18',
            fabricDescription: cols[5] || 'Fabric',
            quantity: cols[6] || '2 pc',
            totalAmount: parseInt(cols[8]?.replace(/[^0-9]/g, '')) || 1600,
            amountPaid: parseInt(cols[8]?.replace(/[^0-9]/g, '')) || 1600,
            balanceAmount: 0,
            paymentStatus: 'PAID',
            orderStatus: 'CONFIRMED'
          };
          newItems.push(orderObj);
        }
        setParsedDiff({ newItems, totalParsed: lines.length - startIdx });
      };

      return (
        <div class="space-y-4 bg-white border border-slate-200 p-6 rounded-3xl">
          <h3 class="font-heading font-bold text-lg text-slate-900">Google Sheet CSV Import & Smart Deduplication</h3>
          <input type="file" accept=".csv" onChange={(e)=>{ const f=e.target.files[0]; if(f){ const r=new FileReader(); r.onload=evt=>handleParseCsvText(evt.target.result); r.readAsText(f); }}} class="text-xs" />
          {parsedDiff && (
            <div class="space-y-2 pt-2">
              <div class="text-xs font-bold text-emerald-700">Parsed {parsedDiff.newItems.length} new unique orders.</div>
              <button onClick={() => { saveOrdersState([...parsedDiff.newItems, ...orders]); setParsedDiff(null); alert("Synced!"); }} class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl text-xs">Confirm Sync</button>
            </div>
          )}
        </div>
      );
    }

    function OmsAnalyticsTab({ orders }) {
      const videoStats = useMemo(() => {
        const stats = {};
        orders.forEach(o => {
          const vid = o.videoAttribution || 'Other';
          if (!stats[vid]) stats[vid] = { count: 0, revenue: 0 };
          stats[vid].count += 1;
          stats[vid].revenue += (o.amountPaid || 0);
        });
        return Object.entries(stats).map(([video, data]) => ({ video, ...data }));
      }, [orders]);

      return (
        <div class="space-y-6">
          <h3 class="font-heading font-bold text-xl text-slate-900">YouTube Video Revenue Attribution</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {videoStats.map(stat => (
              <div key={stat.video} class="bg-white border border-slate-200 p-5 rounded-2xl space-y-3 shadow-xs">
                <div class="flex items-center space-x-2 text-red-600 font-heading font-bold">
                  <span>▶️</span><span>{stat.video}</span>
                </div>
                <div class="flex justify-between text-xs pt-2 border-t border-slate-100">
                  <span class="text-slate-500">Orders:</span><span class="font-bold text-slate-900">{stat.count}</span>
                </div>
                <div class="flex justify-between text-xs">
                  <span class="text-slate-500">Revenue:</span><span class="text-xl font-extrabold text-slate-900 font-heading">₹{stat.revenue.toLocaleString()}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function StockAdjustModal({ product, onClose, onAdjust }) {
      const [delta, setDelta] = useState(5);
      return (
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div class="bg-white border border-slate-200 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-xl">
            <h3 class="font-heading font-bold text-lg text-slate-900">Adjust Stock Level</h3>
            <div class="flex items-center space-x-3 justify-center py-2">
              <button onClick={() => setDelta(d => d - 1)} class="w-10 h-10 bg-slate-100 font-bold text-lg rounded-xl text-slate-900">-</button>
              <input type="number" value={delta} onChange={e => setDelta(Number(e.target.value))} class="w-20 bg-slate-50 border rounded-xl p-2.5 text-center font-bold text-slate-900" />
              <button onClick={() => setDelta(d => d + 1)} class="w-10 h-10 bg-slate-100 font-bold text-lg rounded-xl text-slate-900">+</button>
            </div>
            <div class="flex space-x-2">
              <button onClick={() => onAdjust(product.id, -Math.abs(delta))} class="flex-1 bg-red-100 text-red-700 font-bold py-2 rounded-xl text-xs">- Remove {delta}</button>
              <button onClick={() => onAdjust(product.id, Math.abs(delta))} class="flex-1 bg-emerald-100 text-emerald-800 font-bold py-2 rounded-xl text-xs">+ Add {delta}</button>
            </div>
            <button onClick={onClose} class="w-full text-xs text-slate-400 py-1 font-medium">Cancel</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
