        let updated = [];
        if (existingIndex >= 0) {
          updated = cart.map((item, idx) => 
            idx === existingIndex ? { ...item, qty: item.qty + qty } : item
          );

          updated = [...cart, { product, qty }];

        setShowCartDrawer(true);

        localStorage.setItem('ht_cart', JSON.stringify(updated));

              onSelectProductPdp={setSelectedPdpProduct}
              onAddToCart={(prod) => addToCart(prod, 1)}
              onQuickWhatsapp={(prod) => {
                setWhatsappModalProduct(prod);
                setOrderQtyModal(1);
              }}
              onOpenAdminModal={() => setShowAdminLoginModal(true)}
            />
          ) : (
            <OmsView 
              activeTab={activeTab}
              setActiveTab={setActiveTab}
              orders={orders}
              saveOrdersState={saveOrdersState}
              products={products}
              saveProductsState={saveProductsState}
              storeSettings={storeSettings}
              saveSettingsState={saveSettingsState}
              brandsList={brandsList}
              categoriesList={categoriesList}
              addDynamicBrand={addDynamicBrand}
              addDynamicCategory={addDynamicCategory}
              adminUsers={adminUsers}
              saveAdminUsersState={saveAdminUsersState}
              currentLoggedInUser={currentLoggedInUser}
              totalRevenue={totalRevenue}
              pendingPayment={pendingPayment}
              readyToDispatchCount={readyToDispatchCount}
              lowStockCount={lowStockCount}

                  <p class="text-xs text-slate-500">Master PIN or Approved Staff Credentials</p>

                <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-bold">
                  <button type="button" onClick={() => setAuthModeTab('pin')} class={`flex-1 py-1.5 rounded-lg ${authModeTab === 'pin' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500'}`}>🔑 PIN Access</button>
                  <button type="button" onClick={() => setAuthModeTab('email')} class={`flex-1 py-1.5 rounded-lg ${authModeTab === 'email' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500'}`}>📧 Email Login</button>

                {authModeTab === 'pin' ? (
                  <input 
                    type="password" 
                    placeholder="Enter 4-Digit Security PIN" 
                    value={pinInput} 
                    onChange={e => setPinInput(e.target.value)} 
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-center text-lg font-bold tracking-widest text-slate-900 focus:outline-none focus:border-myntra-pink" 
                    autoFocus 
                  />

                  <div class="space-y-2 text-xs">
                    <div><label class="text-slate-600 font-semibold">Email Address</label><input type="email" required value={emailInput} onChange={e=>setEmailInput(e.target.value)} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold text-slate-900" /></div>
                    <div><label class="text-slate-600 font-semibold">Password</label><input type="password" required value={passwordInput} onChange={e=>setPasswordInput(e.target.value)} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold text-slate-900" /></div>
                  </div>
                )}

                <button type="submit" class="w-full bg-myntra-pink hover:bg-myntra-pinkHover text-white font-bold py-3 rounded-xl text-xs shadow-xs">
                  Unlock OMS Admin Portal
                </button>
                <button type="button" onClick={() => setShowAdminLoginModal(false)} class="w-full text-xs text-slate-500 font-medium">Cancel</button>
              </form>
            </div>
          )}

          {/* SUB-ADMIN ONBOARDING REGISTRATION MODAL (`?invite=staff`) */}
          {showInviteRegistrationModal && (
            <div class="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-4">
              <div class="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div class="text-center space-y-1">
                  <div class="w-12 h-12 rounded-2xl bg-emerald-100 mx-auto flex items-center justify-center text-emerald-700 text-2xl font-bold">🔗</div>
                  <h3 class="font-heading font-extrabold text-lg text-slate-900">Staff Sub-Admin Invitation</h3>
                  <p class="text-xs text-slate-500">Register your credentials for Master Admin approval.</p>
                </div>

                {!inviteSubmittedToast ? (
                  <form onSubmit={handleRegisterStaffInvite} class="space-y-3 text-xs">
                    <div><label class="text-slate-600 font-semibold">Full Name *</label><input type="text" required value={inviteName} onChange={e=>setInviteName(e.target.value)} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold" /></div>
                    <div><label class="text-slate-600 font-semibold">Gmail / Email Address *</label><input type="email" required value={inviteEmail} onChange={e=>setInviteEmail(e.target.value)} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold" /></div>
                    <div><label class="text-slate-600 font-semibold">Password *</label><input type="password" required value={invitePass} onChange={e=>setInvitePass(e.target.value)} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold" /></div>
                    <div><label class="text-slate-600 font-semibold">Desired 4-Digit Security PIN *</label><input type="password" required maxLength="4" value={invitePin} onChange={e=>setInvitePin(e.target.value)} placeholder="e.g. 5560" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono font-bold tracking-widest text-center text-lg" /></div>
                    <button type="submit" class="w-full bg-myntra-pink hover:bg-myntra-pinkHover text-white font-bold py-3 rounded-xl text-xs shadow-xs">
                      Submit Account for Master Approval 🚀
                    </button>
                  </form>
                ) : (
                  <div class="text-center py-6 space-y-3">
                    <div class="text-emerald-600 font-bold text-base">Registration Submitted! ✓</div>
                    <p class="text-xs text-slate-500">Your account status is currently <b>PENDING_APPROVAL</b>. Once Master Admin approves your request, you can log in using your 4-digit PIN.</p>
                    <button onClick={() => setShowInviteRegistrationModal(false)} class="bg-slate-900 text-white font-bold px-4 py-2 rounded-xl text-xs">Close</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* PDP MODAL */}
          {selectedPdpProduct && (
            <ProductDetailPageModal 
              product={selectedPdpProduct}
              storeSettings={storeSettings}
              onClose={() => setSelectedPdpProduct(null)}
              onAddToCart={(prod, qty) => addToCart(prod, qty)}
            />
          )}

          {/* CART DRAWER */}
          {showCartDrawer && (
            <CartDrawer 
              cart={cart}
              storeSettings={storeSettings}
              updateCartQty={updateCartQty}
              onClose={() => setShowCartDrawer(false)}
              onClearCart={() => setCart([])}
            />
          )}

          {/* QUICK WHATSAPP MODAL */}
          {whatsappModalProduct && (
            <WhatsAppModal 
              product={whatsappModalProduct}
              qty={orderQtyModal}
              setQty={setOrderQtyModal}
              storeSettings={storeSettings}
              onClose={() => setWhatsappModalProduct(null)}
            />
          )}

          {/* EDIT PRODUCT ROW MODAL */}
          {editingProductRow && (
            <EditProductModal 
              product={editingProductRow}
              brandsList={brandsList}
              categoriesList={categoriesList}
              addDynamicBrand={addDynamicBrand}
              addDynamicCategory={addDynamicCategory}
              onClose={() => setEditingProductRow(null)}
              onSave={(updatedProduct) => {
                const updated = products.map(p => p.id === updatedProduct.id ? updatedProduct : p);
                saveProductsState(updated);
                setEditingProductRow(null);
              }}
            />
          )}

          {/* STOCK ADJUST MODAL */}
          {stockAdjustProduct && (
            <StockAdjustModal 
              product={stockAdjustProduct}
              onClose={() => setStockAdjustProduct(null)}
              onAdjust={(productId, delta) => {
                const updated = products.map(p => p.id === productId ? { ...p, currentStock: Math.max(0, p.currentStock + delta) } : p);
                saveProductsState(updated);
                setStockAdjustProduct(null);
              }}
            />
          )}

        </div>
      );
    }

    // ==========================================

              <img src={storeSettings.youtubeAvatar} alt="Avatar" class="w-full h-full object-cover" />
            </div>
          </div>

          {/* DEDICATED CATALOG SELECTION */}

            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-3">
              <span class="text-xs font-extrabold text-slate-900 uppercase">Catalogue Browsing Mode:</span>
              <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-bold">
                <button 
                  onClick={() => { setCatalogViewFilterMode('ALL'); setSelectedVideo('ALL'); }}
                  class={`px-4 py-1.5 rounded-lg transition ${catalogViewFilterMode === 'ALL' ? 'bg-myntra-pink text-white shadow-xs' : 'text-slate-600'}`}
                >
                  🌐 Full Standalone Catalog ({allProducts.filter(p=>p.isActive).length})
                </button>
                <button 
                  onClick={() => { setCatalogViewFilterMode('VIDEO'); setSelectedVideo('Video no 18'); }}
                  class={`px-4 py-1.5 rounded-lg transition ${catalogViewFilterMode === 'VIDEO' ? 'bg-myntra-pink text-white shadow-xs' : 'text-slate-600'}`}
                >
                  🎥 Filter by YouTube Video
                </button>
              </div>
            </div>

            {catalogViewFilterMode === 'VIDEO' && (
              <div class="flex items-center space-x-2 overflow-x-auto pb-1 custom-scrollbar">

                  </button>

            <div class="relative">
              <input

              />

            <div class="space-y-2">

    function MyntraProductCard({ product, onClickPdp, onAddToCart, onQuickWhatsapp }) {
      const discountPercent = product.mrpPrice ? Math.round(((product.mrpPrice - product.sellingPrice) / product.mrpPrice) * 100) : 0;

      return (
        <div class="group bg-white border border-myntra-border rounded-2xl overflow-hidden hover:border-pink-300 hover:shadow-lg transition duration-300 flex flex-col justify-between">
          <div class="relative aspect-square w-full bg-slate-100 overflow-hidden cursor-pointer" onClick={onClickPdp}>
            <img src={product.imageUrl} alt={product.name} class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
            {discountPercent > 0 && (
              <span class="absolute top-2 left-2 bg-red-600 text-white font-extrabold text-[10px] px-2 py-0.5 rounded-md shadow-xs">
                {discountPercent}% OFF
              </span>
            )}
            <span class="absolute top-2 right-2 bg-slate-900/80 backdrop-blur-xs text-white text-[10px] font-bold px-2 py-0.5 rounded-md">
              {product.brand}
            </span>
          </div>

          <div class="p-3.5 space-y-3 flex-1 flex flex-col justify-between">
            <div class="space-y-1 cursor-pointer" onClick={onClickPdp}>
              <h4 class="font-heading font-bold text-xs text-slate-900 group-hover:text-myntra-pink transition line-clamp-2 leading-snug">
                {product.name}
              </h4>
              <div class="flex items-baseline space-x-1.5">
                <span class="text-sm font-extrabold text-slate-900 font-heading">₹{product.sellingPrice}</span>
                {product.mrpPrice && <span class="text-[11px] text-slate-400 line-through">₹{product.mrpPrice}</span>}
              </div>
            </div>

            <div class="pt-2 border-t border-slate-100 flex items-center space-x-1.5">
              <button onClick={onAddToCart} class="flex-1 bg-myntra-pink hover:bg-myntra-pinkHover text-white font-bold py-2 rounded-xl text-[11px] text-center shadow-xs transition">
                + Add Cart
              </button>
              <button onClick={onQuickWhatsapp} class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-2.5 py-2 rounded-xl text-[11px] transition shadow-xs" title="Quick WhatsApp Order">
                💬
              </button>
            </div>
          </div>
        </div>
      );
    }

    function ProductDetailPageModal({ product, storeSettings, onClose, onAddToCart }) {
      const [selectedImg, setSelectedImg] = useState(product.imageUrl);
      const [selectedQty, setSelectedQty] = useState(1);
      const discountPercent = product.mrpPrice ? Math.round(((product.mrpPrice - product.sellingPrice) / product.mrpPrice) * 100) : 0;
      const gallery = product.galleryImages && product.galleryImages.length > 0 ? product.galleryImages : [product.imageUrl];
      const totalPrice = product.sellingPrice * selectedQty;

      const whatsappText = `Hi Humjoly Tailors, I want to order:\n\n🧵 *Product*: ${product.name}\n🔖 *SKU*: ${product.sku}\n📏 *Quantity*: ${selectedQty} ${product.unit}\n💵 *Total Price*: ₹${totalPrice}\n\nPlease confirm availability and payment details.`;
      const whatsappUrl = `https://wa.me/${storeSettings.whatsappPhone}?text=${encodeURIComponent(whatsappText)}`;

      return (
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
          <div class="bg-white border border-slate-200 rounded-3xl max-w-2xl w-full p-6 space-y-6 shadow-2xl relative my-8">
            <button onClick={onClose} class="absolute top-4 right-4 text-slate-400 hover:text-slate-900 text-xl font-bold">✕</button>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="space-y-3">
                <div class="aspect-square w-full rounded-2xl overflow-hidden bg-slate-100 border border-slate-200">
                  <img src={selectedImg} class="w-full h-full object-cover" />
                </div>
                {gallery.length > 1 && (
                  <div class="flex space-x-2">
                    {gallery.map((img, idx) => (
                      <img key={idx} src={img} onClick={() => setSelectedImg(img)} class={`w-14 h-14 rounded-xl object-cover cursor-pointer border-2 transition ${selectedImg === img ? 'border-myntra-pink scale-105' : 'border-slate-200'}`} />
                    ))}
                  </div>
                )}
              </div>

              <div class="space-y-4 flex flex-col justify-between">
                <div class="space-y-2">
                  <span class="font-bold text-myntra-pink bg-pink-50 px-2 py-0.5 rounded text-xs border border-pink-200">{product.brand}</span>
                  <h3 class="font-heading font-extrabold text-xl text-slate-900">{product.name}</h3>
                  <div class="flex items-baseline space-x-2 pt-1">
                    <span class="text-2xl font-extrabold text-slate-900 font-heading">₹{product.sellingPrice}</span>
                    {product.mrpPrice && <span class="text-sm text-slate-400 line-through">₹{product.mrpPrice}</span>}
                    {discountPercent > 0 && <span class="bg-red-100 text-red-700 text-xs font-bold px-2 py-0.5 rounded">{discountPercent}% OFF</span>}
                  </div>
                </div>

                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-2 text-xs">
                  <div class="flex justify-between text-slate-600"><span>Fabric Composition:</span><span class="font-semibold text-slate-900">{product.fabricType}</span></div>
                  <div class="flex justify-between text-slate-600"><span>Stock Availability:</span><span class="font-semibold text-emerald-600">{product.currentStock} {product.unit} available</span></div>
                </div>

                <div class="flex items-center justify-between pt-1">
                  <span class="text-xs text-slate-600 font-semibold">Select Quantity:</span>
                  <div class="flex items-center space-x-3 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">
                    <button onClick={() => setSelectedQty(Math.max(1, selectedQty - 1))} class="text-slate-900 font-bold text-sm px-1">-</button>
                    <span class="font-bold text-slate-900 text-xs w-4 text-center">{selectedQty}</span>
                    <button onClick={() => setSelectedQty(selectedQty + 1)} class="text-slate-900 font-bold text-sm px-1">+</button>
                  </div>
                </div>

                <div class="space-y-2 pt-2">
                  <a href={whatsappUrl} target="_blank" rel="noreferrer" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-center block text-xs shadow-xs">
                    💬 Order on WhatsApp (₹{totalPrice})
                  </a>
                  <button onClick={() => { onAddToCart(product, selectedQty); onClose(); }} class="w-full bg-myntra-pink hover:bg-myntra-pinkHover text-white font-bold py-3 rounded-xl text-xs transition">
                    🛒 Add {selectedQty} {product.unit} to Cart
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function CartDrawer({ cart, storeSettings, updateCartQty, onClose, onClearCart }) {
      const totalAmount = cart.reduce((sum, item) => sum + (item.product.sellingPrice * item.qty), 0);

      const generateCombinedWhatsapp = () => {
        let msg = `Hi Humjoly Tailors, I would like to order the following fabrics:\n\n`;
        cart.forEach((item, idx) => {
          msg += `${idx + 1}. *${item.product.name}*\n   📏 Qty: ${item.qty} ${item.product.unit}\n   💵 Price: ₹${item.product.sellingPrice * item.qty}\n`;
        });
        msg += `\n💰 *Total Order Value*: ₹${totalAmount}\n\nPlease confirm availability and payment details.`;
        return `https://wa.me/${storeSettings.whatsappPhone}?text=${encodeURIComponent(msg)}`;
      };

      return (
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex justify-end">
          <div class="bg-white border-l border-slate-200 max-w-md w-full h-full p-6 flex flex-col justify-between shadow-2xl">

    function OmsHolisticProductsTab({ products, saveProductsState, brandsList, categoriesList, addDynamicBrand, addDynamicCategory, onEditRow, onAdjustStock }) {
      const [showAddModal, setShowAddModal] = useState(false);
      const [newProdName, setNewProdName] = useState('');
      const [newProdBrand, setNewProdBrand] = useState(brandsList[0] || 'Soktas');
      const [customBrandInput, setCustomBrandInput] = useState('');
      const [isAddingBrand, setIsAddingBrand] = useState(false);

      const [newProdCategory, setNewProdCategory] = useState(categoriesList[0] || 'Shirting');
      const [customCategoryInput, setCustomCategoryInput] = useState('');
      const [isAddingCategory, setIsAddingCategory] = useState(false);

      const [newProdPrice, setNewProdPrice] = useState(800);
      const [newProdMrp, setNewProdMrp] = useState(1500);
      const [newProdStock, setNewProdStock] = useState(30);

      const [galleryUrls, setGalleryUrls] = useState([PRESET_FABRIC_IMAGES[0].url]);

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => setGalleryUrls([...galleryUrls, evt.target.result]);
        reader.readAsDataURL(file);
      };

      const handleRemoveImageThumbnail = (idx) => {
        if (galleryUrls.length <= 1) return alert("Product must keep at least 1 photo!");
        setGalleryUrls(galleryUrls.filter((_, i) => i !== idx));
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        let targetBrand = newProdBrand;
        if (isAddingBrand && customBrandInput.trim()) {
          targetBrand = customBrandInput.trim();
          addDynamicBrand(targetBrand);
        }

        let targetCategory = newProdCategory;
        if (isAddingCategory && customCategoryInput.trim()) {
          targetCategory = customCategoryInput.trim();
          addDynamicCategory(targetCategory);
        }

        const created = {
          id: `prod-${products.length + 1}`,
          sku: `HT-NEW-${100 + products.length}`,
          name: newProdName,
          brand: targetBrand,
          category: targetCategory,
          fabricType: '100% Cotton',
          mrpPrice: Number(newProdMrp),
          sellingPrice: Number(newProdPrice),
          unit: 'pc',
          currentStock: Number(newProdStock),
          lowStockThreshold: 8,
          featuredInVideos: ['Video no 18'],
          imageUrl: galleryUrls[0] || PRESET_FABRIC_IMAGES[0].url,
          galleryImages: galleryUrls,
          isActive: true,
          description: 'New fabric stock item.'
        };
        saveProductsState([created, ...products]);
        setShowAddModal(false);
      };

      const toggleProductActive = (productId) => {
        const updated = products.map(p => p.id === productId ? { ...p, isActive: !p.isActive } : p);
        saveProductsState(updated);
      };

      const duplicateProductRow = (product) => {
        const cloned = { ...product, id: `prod-${products.length + 1}`, sku: `${product.sku}-COPY`, name: `${product.name} (Variant)` };
        saveProductsState([cloned, ...products]);
      };

      const deleteProductRow = (productId) => {

        <div class="space-y-6">

                <div><label class="text-slate-600 font-semibold">Selling Price (₹)</label><input type="number" required value={newProdPrice} onChange={e=>setNewProdPrice(e.target.value)} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold" /></div>
                <div><label class="text-slate-600 font-semibold">MRP Price (₹)</label><input type="number" value={newProdMrp} onChange={e=>setNewProdMrp(e.target.value)} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5" /></div>

          )}

          <div class="bg-white border border-slate-200 rounded-2xl overflow-x-auto shadow-xs">
            <table class="w-full text-left text-xs">

                <tr>

                  <th class="p-3">Item / SKU</th>
                  <th class="p-3">Brand & Category</th>
                  <th class="p-3">Price</th>
                  <th class="p-3">Stock</th>
                  <th class="p-3">Visibility</th>
                  <th class="p-3 text-right">Actions</th>
                </tr>
              </thead>

                {products.map(p => (
                  <tr key={p.id} class={`hover:bg-slate-50 ${!p.isActive ? 'opacity-50' : ''}`}>

                    <td class="p-3 font-bold text-slate-900">{p.name}<div class="text-[10px] text-slate-400 font-mono">SKU: {p.sku}</div></td>
                    <td class="p-3"><span class="font-bold text-myntra-pink">{p.brand}</span><div class="text-[10px] text-slate-500">{p.category}</div></td>
                    <td class="p-3 font-bold text-slate-900">₹{p.sellingPrice}</td>
                    <td class="p-3">
                      <span class="font-bold">{p.currentStock} {p.unit}</span>
                      <button onClick={() => onAdjustStock(p)} class="ml-2 text-[10px] bg-slate-100 border px-1.5 py-0.5 rounded">+/-</button>
                    </td>
                    <td class="p-3">
                      <button onClick={() => toggleProductActive(p.id)} class={`px-2.5 py-1 rounded text-[10px] font-bold ${p.isActive ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500'}`}>
                        {p.isActive ? '👁️ Visible' : '🙈 Hidden'}

                    </td>
                    <td class="p-3 text-right space-x-1">
                      <button onClick={() => onEditRow(p)} class="bg-slate-100 text-slate-900 px-2 py-1 rounded text-[10px] font-semibold">✏️ Edit</button>
                      <button onClick={() => duplicateProductRow(p)} class="bg-slate-100 text-slate-700 px-2 py-1 rounded text-[10px]">📋 Clone</button>
                      <button onClick={() => deleteProductRow(p.id)} class="bg-red-50 text-red-600 px-2 py-1 rounded text-[10px]">🗑️</button>

    function EditProductModal({ product, brandsList, categoriesList, addDynamicBrand, addDynamicCategory, onClose, onSave }) {
      const [form, setForm] = useState({ ...product });
      const [galleryUrls, setGalleryUrls] = useState(
        product.galleryImages && product.galleryImages.length > 0 ? product.galleryImages : [product.imageUrl]
      );

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => setGalleryUrls([...galleryUrls, evt.target.result]);
        reader.readAsDataURL(file);
      };

      const handleRemoveImageThumbnail = (idx) => {
        if (galleryUrls.length <= 1) return alert("Must keep 1 photo!");
        setGalleryUrls(galleryUrls.filter((_, i) => i !== idx));
      };

      return (
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <form onSubmit={(e)=>{ e.preventDefault(); onSave({ ...form, imageUrl: galleryUrls[0], galleryImages: galleryUrls }); }} class="bg-white border border-slate-200 rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3">
              <h3 class="font-heading font-bold text-lg text-slate-900">Edit Product Row</h3>
              <button type="button" onClick={onClose} class="text-slate-400">✕</button>
            </div>

            <div class="grid grid-cols-2 gap-3 text-xs">
              <div class="col-span-2"><label class="text-slate-600 font-semibold">Product Name</label><input type="text" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 font-bold" /></div>
              <div><label class="text-slate-600 font-semibold">Selling Price (₹)</label><input type="number" value={form.sellingPrice} onChange={e => setForm({ ...form, sellingPrice: Number(e.target.value) })} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 font-bold" /></div>
              <div><label class="text-slate-600 font-semibold">Stock</label><input type="number" value={form.currentStock} onChange={e => setForm({ ...form, currentStock: Number(e.target.value) })} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2" /></div>

              <div class="col-span-2 space-y-2 border-t pt-3">
                <label class="text-myntra-pink font-bold">Photo Upload & Gallery</label>
                <input type="file" accept="image/*" onChange={handleFileUpload} class="text-xs" />
                <div class="flex space-x-2 overflow-x-auto pb-1 custom-scrollbar">
                  {galleryUrls.map((url, idx) => (
                    <div key={idx} class="relative">
                      <img src={url} class="w-12 h-12 rounded-lg object-cover border" />
                      <button type="button" onClick={() => handleRemoveImageThumbnail(idx)} class="absolute -top-1 -right-1 bg-red-600 text-white rounded-full w-4 h-4 text-[9px] flex items-center justify-center font-bold">✕</button>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2 border-t">
              <button type="button" onClick={onClose} class="px-4 py-2 bg-slate-100 text-xs text-slate-700 rounded-xl">Cancel</button>
              <button type="submit" class="px-5 py-2 bg-myntra-pink text-white font-bold text-xs rounded-xl shadow-xs">Save Changes</button>
            </div>
          </form>
        </div>
      );
    }

    // --- DIY CUSTOMIZER & SUB-ADMIN INVITE & APPROVAL QUEUE ---
    function OmsWebsiteCustomizerTab({ storeSettings, saveSettingsState, adminUsers, saveAdminUsersState }) {
      const [formData, setFormData] = useState(storeSettings);
      const [savedToast, setSavedToast] = useState(false);
      const [inviteLinkCopiedToast, setInviteLinkCopiedToast] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        saveSettingsState(formData);
        setSavedToast(true);
        setTimeout(() => setSavedToast(false), 2000);
      };

      const handleGenerateInviteLink = () => {
        const url = `${window.location.origin}${window.location.pathname}?invite=staff`;
        navigator.clipboard.writeText(url);
        setInviteLinkCopiedToast(true);
        setTimeout(() => setInviteLinkCopiedToast(false), 2500);
      };

      const handleApproveSubAdmin = (userId) => {
        const updated = adminUsers.map(u => u.id === userId ? { ...u, status: 'APPROVED' } : u);
        saveAdminUsersState(updated);
      };

      const handleRejectSubAdmin = (userId) => {
        const updated = adminUsers.filter(u => u.id !== userId);
        saveAdminUsersState(updated);
      };

      return (
        <div class="space-y-6 max-w-3xl mx-auto">
          
          {/* DIY CUSTOMIZER */}
          <form onSubmit={handleSubmit} class="bg-white border border-slate-200 rounded-3xl p-6 space-y-4 shadow-xs">
            <div class="flex justify-between border-b pb-3">
              <h3 class="font-heading font-extrabold text-lg text-slate-900">DIY Website Customizer</h3>
              {savedToast && <span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-3 py-1 rounded-full">Saved ✓</span>}
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
              <div><label class="text-slate-600 font-semibold">Store Title</label><input type="text" value={formData.storeName} onChange={e=>setFormData({...formData, storeName:e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold" /></div>
              <div><label class="text-slate-600 font-semibold">WhatsApp Business Phone</label><input type="text" value={formData.whatsappPhone} onChange={e=>setFormData({...formData, whatsappPhone:e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono" /></div>
              <div class="sm:col-span-2"><label class="text-slate-600 font-semibold">Tagline</label><input type="text" value={formData.tagline} onChange={e=>setFormData({...formData, tagline:e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5" /></div>
              <div class="sm:col-span-2"><label class="text-slate-600 font-semibold">Announcement Bar</label><input type="text" value={formData.announcementBar} onChange={e=>setFormData({...formData, announcementBar:e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5" /></div>
            </div>

            <button type="submit" class="w-full bg-myntra-pink text-white font-bold py-3 rounded-xl text-xs shadow-xs">Save Store Customizations</button>
          </form>

          {/* MASTER ADMIN STAFF INVITE LINK & APPROVAL QUEUE */}
          <div class="bg-white border border-slate-200 rounded-3xl p-6 space-y-4 shadow-xs">
            <div class="flex justify-between items-center border-b pb-3">
              <div>
                <h3 class="font-heading font-extrabold text-lg text-slate-900">Sub-Admin Invite & Master Approval Queue</h3>
                <p class="text-xs text-slate-500">Generate staff registration links & approve sub-admin 4-digit PIN access.</p>
              </div>
              <button type="button" onClick={handleGenerateInviteLink} class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-xs">
                {inviteLinkCopiedToast ? 'Copied Invite URL ✓' : '🔗 Generate Staff Invite Link'}
              </button>
            </div>

            <div class="space-y-3 text-xs">
              <h4 class="font-bold text-slate-900 uppercase">Sub-Admin Accounts & Approvals:</h4>
              {adminUsers.map(u => (
                <div key={u.id} class="flex justify-between items-center bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                  <div>
                    <div class="font-bold text-slate-900">{u.name} <span class="text-slate-500">({u.email})</span></div>
                    <div class="text-[10px] text-slate-500">PIN: {u.pin ? '****' : 'N/A'} | Status: <b class={u.status === 'APPROVED' ? 'text-emerald-600' : 'text-amber-600'}>{u.status}</b></div>
                  </div>

                  {u.status === 'PENDING_APPROVAL' ? (
                    <div class="flex space-x-1.5">
                      <button onClick={() => handleApproveSubAdmin(u.id)} class="bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs">
                        ✅ Approve PIN
                      </button>
                      <button onClick={() => handleRejectSubAdmin(u.id)} class="bg-red-600 text-white font-bold px-2.5 py-1.5 rounded-lg text-xs">
                        ✕ Reject
                      </button>
                    </div>
                  ) : (
                    <span class="bg-emerald-100 text-emerald-800 font-bold px-2.5 py-1 rounded-lg text-[10px]">
                      {u.role} ✓
                    </span>
                  )}
                </div>
              ))}
            </div>
          </div>

        </div>
      );
    }

    function OmsCsvImportAndDedupeTab({ orders, saveOrdersState }) {
      const [parsedDiff, setParsedDiff] = useState(null);

      const handleParseCsvText = (csvContent) => {
        const lines = csvContent.split(/\r?\n/).filter(line => line.trim().length > 0);
        if (lines.length <= 1) return;
        const newItems = [];
        const startIdx = lines[0].toUpperCase().includes('NAME') ? 1 : 0;

        for (let i = startIdx; i < lines.length; i++) {
          const cols = lines[i].split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
          if (cols.length < 3) continue;

          const orderObj = {
            id: `HT-${1000 + orders.length + newItems.length + 1}`,
            ie: parseInt(cols[0]) || (orders.length + i),
            date: cols[3] || 'Today',
            customer: { name: cols[1] || 'Customer', phone: cols[2] || '', address: cols[7] || 'Local' },
            videoAttribution: cols[4] || 'Video no 18',
            fabricDescription: cols[5] || 'Fabric',
            quantity: cols[6] || '2 pc',
            totalAmount: parseInt(cols[8]?.replace(/[^0-9]/g, '')) || 1600,
            amountPaid: parseInt(cols[8]?.replace(/[^0-9]/g, '')) || 1600,
            balanceAmount: 0,
            paymentStatus: 'PAID',
            orderStatus: 'CONFIRMED'
          };
          newItems.push(orderObj);
        }
        setParsedDiff({ newItems, totalParsed: lines.length - startIdx });
      };

      return (
        <div class="space-y-4 bg-white border border-slate-200 p-6 rounded-3xl">
          <h3 class="font-heading font-bold text-lg text-slate-900">Google Sheet CSV Import & Smart Deduplication</h3>
          <input type="file" accept=".csv" onChange={(e)=>{ const f=e.target.files[0]; if(f){ const r=new FileReader(); r.onload=evt=>handleParseCsvText(evt.target.result); r.readAsText(f); }}} class="text-xs" />
          {parsedDiff && (
            <div class="space-y-2 pt-2">
              <div class="text-xs font-bold text-emerald-700">Parsed {parsedDiff.newItems.length} new unique orders.</div>
              <button onClick={() => { saveOrdersState([...parsedDiff.newItems, ...orders]); setParsedDiff(null); alert("Synced!"); }} class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl text-xs">Confirm Sync</button>
            </div>
          )}
        </div>
      );
    }

    function OmsAnalyticsTab({ orders }) {
      const videoStats = useMemo(() => {
        const stats = {};
        orders.forEach(o => {
          const vid = o.videoAttribution || 'Other';
          if (!stats[vid]) stats[vid] = { count: 0, revenue: 0 };
          stats[vid].count += 1;
          stats[vid].revenue += (o.amountPaid || 0);
        });
        return Object.entries(stats).map(([video, data]) => ({ video, ...data }));
      }, [orders]);

      return (
        <div class="space-y-6">
          <h3 class="font-heading font-bold text-xl text-slate-900">YouTube Video Revenue Attribution</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {videoStats.map(stat => (
              <div key={stat.video} class="bg-white border border-slate-200 p-5 rounded-2xl space-y-3 shadow-xs">
                <div class="flex items-center space-x-2 text-red-600 font-heading font-bold">
                  <span>▶️</span><span>{stat.video}</span>
                </div>
                <div class="flex justify-between text-xs pt-2 border-t border-slate-100">
                  <span class="text-slate-500">Orders:</span><span class="font-bold text-slate-900">{stat.count}</span>
                </div>
                <div class="flex justify-between text-xs">
                  <span class="text-slate-500">Revenue:</span><span class="text-xl font-extrabold text-slate-900 font-heading">₹{stat.revenue.toLocaleString()}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function StockAdjustModal({ product, onClose, onAdjust }) {
      const [delta, setDelta] = useState(5);
      return (
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div class="bg-white border border-slate-200 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-xl">
            <h3 class="font-heading font-bold text-lg text-slate-900">Adjust Stock Level</h3>
            <div class="flex items-center space-x-3 justify-center py-2">
              <button onClick={() => setDelta(d => d - 1)} class="w-10 h-10 bg-slate-100 font-bold text-lg rounded-xl text-slate-900">-</button>
              <input type="number" value={delta} onChange={e => setDelta(Number(e.target.value))} class="w-20 bg-slate-50 border rounded-xl p-2.5 text-center font-bold text-slate-900" />
              <button onClick={() => setDelta(d => d + 1)} class="w-10 h-10 bg-slate-100 font-bold text-lg rounded-xl text-slate-900">+</button>
            </div>
            <div class="flex space-x-2">
              <button onClick={() => onAdjust(product.id, -Math.abs(delta))} class="flex-1 bg-red-100 text-red-700 font-bold py-2 rounded-xl text-xs">- Remove {delta}</button>
              <button onClick={() => onAdjust(product.id, Math.abs(delta))} class="flex-1 bg-emerald-100 text-emerald-800 font-bold py-2 rounded-xl text-xs">+ Add {delta}</button>
            </div>
            <button onClick={onClose} class="w-full text-xs text-slate-400 py-1 font-medium">Cancel</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
