    // --- MAIN REACT APPLICATION ---
    function App() {
      const [viewMode, setViewMode] = useState('store');
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [showAdminPinModal, setShowAdminPinModal] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(false);

      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [orders, setOrders] = useState(INITIAL_ORDERS);
      const [storeSettings, setStoreSettings] = useState(DEFAULT_STORE_SETTINGS);
      const [activeTab, setActiveTab] = useState('orders');

      const [cart, setCart] = useState([]);
      const [showCartDrawer, setShowCartDrawer] = useState(false);

      const [selectedVideo, setSelectedVideo] = useState('ALL');
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [selectedBrand, setSelectedBrand] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');

      const [whatsappModalProduct, setWhatsappModalProduct] = useState(null);
      const [orderQtyModal, setOrderQtyModal] = useState(1);
      const [selectedOrderForDrawer, setSelectedOrderForDrawer] = useState(null);
      const [editingProductRow, setEditingProductRow] = useState(null);
      const [stockAdjustProduct, setStockAdjustProduct] = useState(null);

      useEffect(() => {
        const savedProds = localStorage.getItem('ht_products');
        const savedOrders = localStorage.getItem('ht_orders');
        const savedSettings = localStorage.getItem('ht_settings');
        const savedCart = localStorage.getItem('ht_cart');
        if (savedProds) setProducts(JSON.parse(savedProds));
        if (savedOrders) setOrders(JSON.parse(savedOrders));
        if (savedSettings) setStoreSettings(JSON.parse(savedSettings));
        if (savedCart) setCart(JSON.parse(savedCart));
      }, []);

      const saveProductsState = (newProducts) => {
        setProducts(newProducts);
        localStorage.setItem('ht_products', JSON.stringify(newProducts));
      };

      const saveOrdersState = (newOrders) => {
        setOrders(newOrders);
        localStorage.setItem('ht_orders', JSON.stringify(newOrders));
      };

      const saveSettingsState = (newSettings) => {
        setStoreSettings(newSettings);
        localStorage.setItem('ht_settings', JSON.stringify(newSettings));
      };

      const saveCartState = (newCart) => {
        setCart(newCart);
        localStorage.setItem('ht_cart', JSON.stringify(newCart));
      };

      const addToCart = (product, qty = 1) => {
        const existingIndex = cart.findIndex(item => item.product.id === product.id);
        let updated = [];
        if (existingIndex >= 0) {
          updated = cart.map((item, idx) => 
            idx === existingIndex ? { ...item, qty: item.qty + qty } : item
          );
        } else {
          updated = [...cart, { product, qty }];
        }
        saveCartState(updated);
        setShowCartDrawer(true);
      };

      const updateCartQty = (productId, newQty) => {
        if (newQty <= 0) {
          saveCartState(cart.filter(item => item.product.id !== productId));
        } else {
          saveCartState(cart.map(item => item.product.id === productId ? { ...item, qty: newQty } : item));
        }
      };

      const handleSwitchMode = (mode) => {
        if (mode === 'oms' && !isAdminAuthenticated) {
          setShowAdminPinModal(true);
        } else {
          setViewMode(mode);
        }
      };

      const handleVerifyPin = (e) => {
        e.preventDefault();
        if (pinInput === storeSettings.adminPin) {
          setIsAdminAuthenticated(true);
          setShowAdminPinModal(false);
          setPinInput('');
          setPinError(false);
          setViewMode('oms');
        } else {
          setPinError(true);
        }
      };

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          if (!p.isActive) return false;
          if (selectedVideo !== 'ALL' && !p.featuredInVideos.includes(selectedVideo)) return false;
          if (selectedCategory !== 'ALL' && p.category !== selectedCategory) return false;
          if (selectedBrand !== 'ALL' && p.brand !== selectedBrand) return false;
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            return (
              p.name.toLowerCase().includes(q) || 
              p.fabricType.toLowerCase().includes(q) || 
              p.sku.toLowerCase().includes(q) ||
              (p.brand && p.brand.toLowerCase().includes(q))
            );
          }
          return true;
        });

      const readyToDispatchCount = useMemo(() => orders.filter(o => o.orderStatus === 'READY_TO_DISPATCH').length, [orders]);
      const lowStockCount = useMemo(() => products.filter(p => p.currentStock <= p.lowStockThreshold).length, [products]);

              </div>

                </h1>

              >
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>WhatsApp Line</span>
              </a>
            </div>
          </header>

          {viewMode === 'store' ? (
            <StorefrontView 
              products={filteredProducts}
              allProducts={products}
              storeSettings={storeSettings}
              selectedVideo={selectedVideo}
              setSelectedVideo={setSelectedVideo}
              selectedCategory={selectedCategory}
              setSelectedCategory={setSelectedCategory}
              selectedBrand={selectedBrand}
              setSelectedBrand={setSelectedBrand}
              searchQuery={searchQuery}
              setSearchQuery={setSearchQuery}
              onAddToCart={(prod) => addToCart(prod, 1)}
              onQuickWhatsapp={(prod) => {
                setWhatsappModalProduct(prod);
                setOrderQtyModal(1);
              }}
            />
          ) : (
            <OmsView 
              activeTab={activeTab}
              setActiveTab={setActiveTab}
              orders={orders}
              saveOrdersState={saveOrdersState}
              products={products}
              saveProductsState={saveProductsState}
              storeSettings={storeSettings}
              saveSettingsState={saveSettingsState}
              totalRevenue={totalRevenue}
              pendingPayment={pendingPayment}
              readyToDispatchCount={readyToDispatchCount}
              lowStockCount={lowStockCount}
              setSelectedOrderForDrawer={setSelectedOrderForDrawer}
              setEditingProductRow={setEditingProductRow}
              setStockAdjustProduct={setStockAdjustProduct}
            />
          )}

          {showAdminPinModal && (
            <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={handleVerifyPin} class="bg-zinc-900 border border-zinc-700 rounded-3xl max-w-sm w-full p-6 space-y-5 shadow-2xl">
                <div class="text-center space-y-2">
                  <div class="w-12 h-12 rounded-2xl gold-bg-gradient mx-auto flex items-center justify-center text-black text-2xl font-bold">
                    🔒
                  </div>
                  <h3 class="font-heading font-bold text-xl text-white">Owner Security Authentication</h3>
                  <p class="text-xs text-zinc-400">Enter Admin PIN to access Internal OMS & Catalog Controls</p>
                </div>

                <div class="space-y-2">
                  <input 
                    type="password"
                    placeholder="Enter Security PIN (Default: 1974)"
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    class="w-full bg-zinc-950 border border-zinc-700 rounded-xl p-3 text-center text-lg tracking-widest text-amber-400 font-bold focus:outline-none focus:border-amber-500"
                    autoFocus
                  />
                  {pinError && <p class="text-xs text-red-400 text-center">Invalid Security PIN. Please try again.</p>}
                </div>

                <div class="space-y-2">
                  <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3 rounded-xl text-xs transition shadow">
                    Unlock Admin Access
                  </button>
                  <button type="button" onClick={() => setShowAdminPinModal(false)} class="w-full bg-zinc-800 text-zinc-400 py-2 rounded-xl text-xs font-medium">
                    Cancel
                  </button>
                </div>
              </form>
            </div>
          )}

          {showCartDrawer && (
            <CartDrawer 
              cart={cart}
              storeSettings={storeSettings}
              updateCartQty={updateCartQty}
              onClose={() => setShowCartDrawer(false)}
              onClearCart={() => saveCartState([])}
            />
          )}

          {whatsappModalProduct && (
            <WhatsAppModal 
              product={whatsappModalProduct}
              qty={orderQtyModal}
              setQty={setOrderQtyModal}
              storeSettings={storeSettings}
              onClose={() => setWhatsappModalProduct(null)}
            />
          )}

          {selectedOrderForDrawer && (
            <OrderDetailModal 
              order={selectedOrderForDrawer}
              onClose={() => setSelectedOrderForDrawer(null)}
              onUpdateStatus={(orderId, newStatus) => {
                const updated = orders.map(o => o.id === orderId ? { ...o, orderStatus: newStatus } : o);
                saveOrdersState(updated);
                setSelectedOrderForDrawer(prev => ({ ...prev, orderStatus: newStatus }));
              }}
            />
          )}

          {editingProductRow && (
            <EditProductModal 
              product={editingProductRow}
              onClose={() => setEditingProductRow(null)}
              onSave={(updatedProduct) => {
                const updated = products.map(p => p.id === updatedProduct.id ? updatedProduct : p);
                saveProductsState(updated);
                setEditingProductRow(null);
              }}
            />
          )}

          {stockAdjustProduct && (
            <StockAdjustModal 
              product={stockAdjustProduct}
              onClose={() => setStockAdjustProduct(null)}
              onAdjust={(productId, delta) => {
                const updated = products.map(p => p.id === productId ? { ...p, currentStock: Math.max(0, p.currentStock + delta) } : p);
                saveProductsState(updated);
                setStockAdjustProduct(null);
              }}
            />
          )}

        </div>
      );

      onQuickWhatsapp

      const brandOptions = ['ALL', 'Soktas', 'Raymond', 'Siyaram', 'Solino', 'D&J'];

      const videoTimelineItems = useMemo(() => {
        if (selectedVideo === 'ALL') return [];
        return allProducts.filter(p => p.isActive && p.featuredInVideos.includes(selectedVideo));
      }, [allProducts, selectedVideo]);

        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8">

    function CartDrawer({ cart, storeSettings, updateCartQty, onClose, onClearCart }) {
      const totalAmount = cart.reduce((sum, item) => sum + (item.product.sellingPrice * item.qty), 0);

      const generateCombinedWhatsapp = () => {
        let msg = `Hi Humjoly Tailors, I would like to order the following fabrics:\n\n`;
        cart.forEach((item, idx) => {
          msg += `${idx + 1}. *${item.product.name}*\n   📏 Qty: ${item.qty} ${item.product.unit}\n   💵 Price: ₹${item.product.sellingPrice * item.qty}\n`;
        });
        msg += `\n💰 *Total Order Value*: ₹${totalAmount}\n\nPlease confirm availability and payment details.`;
        const encoded = encodeURIComponent(msg);
        return `https://wa.me/${storeSettings.whatsappPhone}?text=${encoded}`;
      };

      return (
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex justify-end">
          <div class="bg-zinc-900 border-l border-zinc-800 max-w-md w-full h-full p-6 flex flex-col justify-between shadow-2xl">
            <div class="space-y-4">
              <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
                <div class="flex items-center space-x-2">
                  <span class="text-xl">🛒</span>
                  <h3 class="font-heading font-bold text-xl text-white">Your Fabric Cart</h3>
                  <span class="bg-amber-500 text-black text-xs font-bold px-2 py-0.5 rounded-full">{cart.reduce((s,i)=>s+i.qty,0)}</span>
                </div>
                <button onClick={onClose} class="text-zinc-400 hover:text-white text-xl">✕</button>
              </div>

              {cart.length === 0 ? (
                <div class="text-center py-12 space-y-3">
                  <div class="text-4xl">🛍️</div>
                  <p class="text-sm text-zinc-400">Your fabric cart is empty.</p>
                </div>
              ) : (
                <div class="space-y-3 max-h-[60vh] overflow-y-auto custom-scrollbar pr-1">
                  {cart.map((item) => (
                    <div key={item.product.id} class="bg-zinc-950 p-3 rounded-2xl border border-zinc-800 flex space-x-3 items-center justify-between">
                      <img src={item.product.imageUrl} class="w-14 h-14 rounded-xl object-cover" />
                      <div class="flex-1 min-w-0">
                        <h4 class="font-heading font-bold text-xs text-white truncate">{item.product.name}</h4>
                        <div class="text-xs text-amber-400 font-semibold mt-0.5">₹{item.product.sellingPrice} / {item.product.unit}</div>
                      </div>
                      <div class="flex items-center space-x-2 bg-zinc-900 px-2 py-1 rounded-lg border border-zinc-800">
                        <button onClick={() => updateCartQty(item.product.id, item.qty - 1)} class="text-amber-400 font-bold px-1 text-xs">-</button>
                        <span class="text-xs font-bold text-white w-4 text-center">{item.qty}</span>
                        <button onClick={() => updateCartQty(item.product.id, item.qty + 1)} class="text-amber-400 font-bold px-1 text-xs">+</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {cart.length > 0 && (
              <div class="space-y-4 border-t border-zinc-800 pt-4">
                <div class="flex justify-between items-baseline">
                  <span class="text-xs text-zinc-400 font-medium">Total Order Value:</span>
                  <span class="text-2xl font-extrabold text-amber-400 font-heading">₹{totalAmount}</span>
                </div>
                <a href={generateCombinedWhatsapp()} target="_blank" rel="noreferrer" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl text-center block text-sm shadow">
                  Send Combined Order on WhatsApp 🚀
                </a>
                <button onClick={onClearCart} class="w-full text-xs text-zinc-500 hover:text-zinc-300 py-1">Clear Cart Items</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function WhatsAppModal({ product, qty, setQty, storeSettings, onClose }) {
      const totalPrice = product.sellingPrice * qty;
      const videoRef = product.featuredInVideos?.[0] || 'YouTube Video';
      const whatsappText = `Hi Humjoly Tailors, I want to order:\n\n🧵 *Product*: ${product.name}\n🔖 *SKU*: ${product.sku}\n📏 *Quantity*: ${qty} ${product.unit}\n💵 *Total Price*: ₹${totalPrice}\n🎥 *Reference*: ${videoRef}\n\nPlease confirm availability and payment details.`;
      const encodedText = encodeURIComponent(whatsappText);
      const whatsappUrl = `https://wa.me/${storeSettings.whatsappPhone}?text=${encodedText}`;

      return (
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="bg-zinc-900 border border-zinc-700 rounded-3xl max-w-md w-full p-6 space-y-6 shadow-2xl">

            <div class="bg-zinc-950 p-4 rounded-2xl space-y-3 border border-zinc-800">
              <div class="flex space-x-3">
                <img src={product.imageUrl} class="w-16 h-16 rounded-xl object-cover" />
                <div>
                  <h4 class="font-heading font-bold text-sm text-white">{product.name}</h4>
                  <p class="text-xs text-amber-400 font-semibold mt-1">₹{product.sellingPrice} / {product.unit}</p>
                </div>
              </div>
            </div>
            <div class="space-y-3">
              <a href={whatsappUrl} target="_blank" rel="noreferrer" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl text-center block text-sm shadow">Send Message on WhatsApp 🚀</a>
              <button onClick={onClose} class="w-full bg-zinc-800 text-zinc-300 py-2.5 rounded-xl text-xs">Cancel</button>

          </div>

      );

    function OmsOrdersTab({ orders, saveOrdersState, onSelectOrder, onGoCreate }) {
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');

      const filteredOrders = useMemo(() => {
        return orders.filter(o => {
          if (filterStatus !== 'ALL' && o.orderStatus !== filterStatus) return false;
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            return (
              o.customer.name.toLowerCase().includes(q) ||
              o.customer.phone.includes(q) ||
              o.id.toLowerCase().includes(q) ||
              o.fabricDescription.toLowerCase().includes(q)
            );
          }
          return true;
        });
      }, [orders, filterStatus, searchQuery]);

      const statusBadges = {
        DRAFT: 'bg-zinc-800 text-zinc-400 border-zinc-700',
        CONFIRMED: 'bg-blue-950 text-blue-400 border-blue-800',
        PAYMENT_PENDING: 'bg-red-950 text-red-400 border-red-800',
        PROCESSING: 'bg-amber-950 text-amber-400 border-amber-800',
        READY_TO_DISPATCH: 'bg-purple-950 text-purple-400 border-purple-800',
        DISPATCHED: 'bg-emerald-950 text-emerald-400 border-emerald-800',
        DELIVERED: 'bg-emerald-900 text-emerald-300 border-emerald-600',
      };

      return (
        <div class="space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div class="relative flex-1 max-w-md">
              <input type="text" placeholder="Search orders by customer name, phone, order ID..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 pl-10 text-xs text-white" />
              <span class="absolute left-3.5 top-3 text-zinc-500 text-xs">🔍</span>
            </div>
            <button onClick={onGoCreate} class="bg-amber-500 text-black font-bold px-4 py-2.5 rounded-xl text-xs">+ Create New Order</button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {filteredOrders.map(order => (
              <div key={order.id} onClick={() => onSelectOrder(order)} class="bg-zinc-900 border border-zinc-800 hover:border-amber-500/40 p-5 rounded-2xl cursor-pointer space-y-4">
                <div class="flex items-center justify-between">
                  <span class="font-heading font-extrabold text-amber-400 text-sm">{order.id}</span>
                  <span class={`text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-md border ${statusBadges[order.orderStatus] || statusBadges.CONFIRMED}`}>
                    {order.orderStatus.replace(/_/g, ' ')}
                  </span>
                </div>
                <div>
                  <h4 class="font-heading font-bold text-white text-base">{order.customer.name}</h4>
                  <p class="text-xs text-zinc-400">📞 {order.customer.phone}</p>
                </div>
                <div class="bg-zinc-950 p-3 rounded-xl border border-zinc-850 space-y-1 text-xs">
                  <div class="flex justify-between text-zinc-400"><span>Fabric:</span><span class="text-zinc-200 font-medium truncate max-w-[140px]">{order.fabricDescription}</span></div>
                  <div class="flex justify-between text-zinc-400"><span>Qty:</span><span class="text-zinc-200 font-medium">{order.quantity}</span></div>
                  <div class="flex justify-between text-zinc-400"><span>Video Tag:</span><span class="text-red-400 font-semibold">{order.videoAttribution}</span></div>
                </div>

    // --- OMS CSV / EXCEL FILE IMPORTER & SMART DEDUPLICATION ENGINE ---
    function OmsCsvImportAndDedupeTab({ orders, saveOrdersState }) {
      const [parsedDiff, setParsedDiff] = useState(null);
      const [isDragging, setIsDragging] = useState(false);

      // Parse CSV File or Raw Text
      const handleParseCsvText = (csvContent) => {
        const lines = csvContent.split(/\r?\n/).filter(line => line.trim().length > 0);
        if (lines.length <= 1) return;

        const newItems = [];
        const updatedItems = [];
        const skippedDuplicates = [];

        // Skip header if present
        const startIdx = lines[0].toUpperCase().includes('NAME') || lines[0].toUpperCase().includes('PHONE') ? 1 : 0;

        for (let i = startIdx; i < lines.length; i++) {
          const cols = lines[i].split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
          if (cols.length < 3) continue;

          const ieVal = parseInt(cols[0]) || (orders.length + i + 1);
          const nameVal = cols[1] || 'Customer';
          const phoneVal = cols[2] || '';
          const dateVal = cols[3] || new Date().toLocaleDateString('en-GB');
          const videoVal = cols[4] || 'Video no 18';
          const fabricVal = cols[5] || 'Fabric';
          const qtyVal = cols[6] || '2 pc';
          const addressVal = cols[7] || 'Local';
          const paidVal = parseInt(cols[8]?.replace(/[^0-9]/g, '')) || 1600;
          const statusVal = cols[9]?.toUpperCase().includes('REC') ? 'PAID' : 'PARTIAL';

          // Smart Deduplication check
          const existingMatch = orders.find(existing => {
            if (existing.ie && existing.ie === ieVal) return true;
            if (existing.customer.phone === phoneVal && existing.date === dateVal && existing.fabricDescription === fabricVal) return true;
            return false;
          });

          const orderObj = {
            id: `HT-${1000 + orders.length + newItems.length + 1}`,
            ie: ieVal,
            date: dateVal,
            customer: { name: nameVal, phone: phoneVal, address: addressVal },
            videoAttribution: videoVal,
            fabricDescription: fabricVal,
            quantity: qtyVal,
            totalAmount: paidVal,
            amountPaid: paidVal,
            balanceAmount: 0,
            paymentStatus: statusVal,
            orderStatus: 'CONFIRMED',
            source: 'Google Sheet CSV Import'
          };

          if (existingMatch) {
            if (existingMatch.amountPaid !== paidVal || existingMatch.paymentStatus !== statusVal) {
              updatedItems.push({ original: existingMatch, updated: orderObj });
            } else {
              skippedDuplicates.push(orderObj);
            }
          } else {
            newItems.push(orderObj);
          }
        }

        setParsedDiff({
          newItems,
          updatedItems,
          skippedDuplicates,
          totalParsed: lines.length - startIdx
        });
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => handleParseCsvText(evt.target.result);
        reader.readAsText(file);
      };

      const handleConfirmSync = () => {
        if (!parsedDiff) return;
        const merged = [...parsedDiff.newItems, ...orders];
        saveOrdersState(merged);
        alert(`Successfully synced ${parsedDiff.newItems.length} unique new orders to OMS database & Firestore!`);
        setParsedDiff(null);
      };

      return (
        <div class="space-y-6">
          <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-3xl space-y-4">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-4">
              <div>
                <h3 class="font-heading font-bold text-xl text-white">Google Sheet / CSV / Excel Import & Smart Deduplication</h3>
                <p class="text-xs text-zinc-400">Upload CSV files exported from Google Sheets. The smart engine auto-deduplicates phone numbers and orders.</p>
              </div>
            </div>

            {/* Dropzone */}
            <div 
              onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
              onDragLeave={() => setIsDragging(false)}
              onDrop={(e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files.length) {
                  const file = e.dataTransfer.files[0];
                  const reader = new FileReader();
                  reader.onload = (evt) => handleParseCsvText(evt.target.result);
                  reader.readAsText(file);
                }
              }}
              class={`border-2 border-dashed rounded-2xl p-8 text-center space-y-4 transition ${isDragging ? 'border-amber-500 bg-amber-500/10' : 'border-zinc-700 bg-zinc-950/50 hover:border-amber-500/50'}`}
            >
              <div class="text-4xl">📥 📊</div>
              <div>
                <h4 class="font-heading font-semibold text-sm text-zinc-200">Drag & Drop Google Sheets CSV / Excel File</h4>
                <p class="text-xs text-zinc-500 mt-1">Supports standard CSV format exported from Google Sheets</p>
              </div>

              <input type="file" accept=".csv,.txt" onChange={handleFileUpload} class="hidden" id="csvFileInput" />
              <label for="csvFileInput" class="inline-block bg-amber-500 hover:bg-amber-400 text-black font-bold px-4 py-2 rounded-xl text-xs cursor-pointer shadow">
                Browse CSV File
              </label>
            </div>
          </div>

          {/* DEDUPLICATION RESULTS DIFF PREVIEW */}
          {parsedDiff && (
            <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-3xl space-y-5">
              <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
                <span class="font-heading font-bold text-lg text-white">Parsed File & Deduplication Diff Results</span>
                <span class="bg-zinc-800 text-zinc-300 text-xs font-bold px-3 py-1 rounded-full">
                  Total Parsed Rows: {parsedDiff.totalParsed}
                </span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-center">
                <div class="bg-emerald-950/60 border border-emerald-800 p-4 rounded-2xl space-y-1">
                  <div class="text-xs text-emerald-400 font-semibold">🆕 New Unique Orders</div>
                  <div class="text-2xl font-extrabold text-emerald-300 font-heading">{parsedDiff.newItems.length}</div>
                </div>
                <div class="bg-amber-950/60 border border-amber-800 p-4 rounded-2xl space-y-1">
                  <div class="text-xs text-amber-400 font-semibold">🔄 Updated Status Orders</div>
                  <div class="text-2xl font-extrabold text-amber-300 font-heading">{parsedDiff.updatedItems.length}</div>
                </div>
                <div class="bg-red-950/60 border border-red-800 p-4 rounded-2xl space-y-1">
                  <div class="text-xs text-red-400 font-semibold">🚫 Duplicates Skipped</div>
                  <div class="text-2xl font-extrabold text-red-300 font-heading">{parsedDiff.skippedDuplicates.length}</div>
                </div>
              </div>

              {parsedDiff.newItems.length > 0 && (
                <div class="space-y-3">
                  <h4 class="font-heading font-semibold text-xs text-zinc-400 uppercase tracking-wider">Preview New Unique Orders to Add:</h4>
                  <div class="bg-zinc-950 rounded-xl p-3 max-h-48 overflow-y-auto custom-scrollbar border border-zinc-800 space-y-2 text-xs">
                    {parsedDiff.newItems.map((item, idx) => (
                      <div key={idx} class="flex justify-between items-center border-b border-zinc-800 pb-1.5">
                        <span class="text-white font-bold">{item.customer.name} ({item.customer.phone})</span>
                        <span class="text-amber-400 font-medium">{item.fabricDescription} - ₹{item.totalAmount}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div class="flex justify-end space-x-3 pt-2">
                <button onClick={() => setParsedDiff(null)} class="px-4 py-2 bg-zinc-800 text-zinc-300 text-xs rounded-xl font-semibold">
                  Cancel
                </button>
                <button onClick={handleConfirmSync} class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow">
                  Confirm & Sync {parsedDiff.newItems.length} Unique Orders ✓
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

                <label class="text-zinc-400 font-semibold uppercase">Update Lifecycle Status:</label>
                <div class="grid grid-cols-2 gap-2">
                  {['CONFIRMED', 'PROCESSING', 'READY_TO_DISPATCH', 'DISPATCHED', 'DELIVERED'].map(st => (
                    <button key={st} onClick={() => onUpdateStatus(order.id, st)} class={`p-2 rounded-lg text-center font-bold text-[10px] border transition ${order.orderStatus === st ? 'bg-amber-500 text-black border-amber-400' : 'bg-zinc-800 text-zinc-300'}`}>
                      {st.replace(/_/g, ' ')}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function EditProductModal({ product, onClose, onSave }) {
      const [form, setForm] = useState({ ...product });
      return (
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <form onSubmit={(e) => { e.preventDefault(); onSave(form); }} class="bg-zinc-900 border border-zinc-700 rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
              <h3 class="font-heading font-bold text-lg text-white">Edit Inventory Item Row</h3>
              <button type="button" onClick={onClose} class="text-zinc-400">✕</button>
            </div>
            <div class="grid grid-cols-2 gap-3 text-xs">
              <div class="col-span-2"><label class="text-zinc-400">Product Name</label><input type="text" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} class="w-full bg-zinc-950 p-2 text-white border border-zinc-800 rounded-lg font-bold" /></div>
              <div><label class="text-zinc-400">Selling Price (₹)</label><input type="number" value={form.sellingPrice} onChange={e => setForm({ ...form, sellingPrice: Number(e.target.value) })} class="w-full bg-zinc-950 p-2 text-white border border-zinc-800 rounded-lg" /></div>
              <div><label class="text-zinc-400">Stock Quantity</label><input type="number" value={form.currentStock} onChange={e => setForm({ ...form, currentStock: Number(e.target.value) })} class="w-full bg-zinc-950 p-2 text-white border border-zinc-800 rounded-lg" /></div>
            </div>
            <div class="flex justify-end space-x-2 pt-2">
              <button type="button" onClick={onClose} class="px-4 py-2 bg-zinc-800 text-xs text-zinc-300 rounded-xl">Cancel</button>
              <button type="submit" class="px-5 py-2 bg-amber-500 text-black font-bold text-xs rounded-xl">Save Changes</button>
            </div>
          </form>
        </div>
      );
    }

    function StockAdjustModal({ product, onClose, onAdjust }) {
      const [delta, setDelta] = useState(5);
      return (
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="bg-zinc-900 border border-zinc-700 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
            <h3 class="font-heading font-bold text-lg text-white">Adjust Stock Level</h3>
            <div class="flex items-center space-x-3 justify-center py-2">
              <button onClick={() => setDelta(d => d - 1)} class="w-10 h-10 bg-zinc-800 text-amber-400 font-bold text-lg rounded-xl">-</button>
              <input type="number" value={delta} onChange={e => setDelta(Number(e.target.value))} class="w-20 bg-zinc-950 p-2.5 text-center font-bold text-white border border-zinc-800 rounded-xl" />
              <button onClick={() => setDelta(d => d + 1)} class="w-10 h-10 bg-zinc-800 text-amber-400 font-bold text-lg rounded-xl">+</button>
            </div>
            <div class="flex space-x-2">
              <button onClick={() => onAdjust(product.id, -Math.abs(delta))} class="flex-1 bg-red-950 text-red-400 font-bold py-2.5 rounded-xl text-xs border border-red-800">- Remove {delta}</button>
              <button onClick={() => onAdjust(product.id, Math.abs(delta))} class="flex-1 bg-emerald-950 text-emerald-400 font-bold py-2.5 rounded-xl text-xs border border-emerald-800">+ Add {delta}</button>
            </div>
            <button onClick={onClose} class="w-full bg-zinc-800 text-zinc-400 py-2 rounded-xl text-xs font-medium">Cancel</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
