    const DEFAULT_STORE_SETTINGS = {
      storeName: 'HUMJOLY TAILORS',
      tagline: 'SUITING AND SHIRTING FABRICS RAYMOND SIYARAM SOKTAS',
      announcementBar: '✨ Free shipping across India on orders above ₹1500 | Explore YouTube Collections',

      youtubeAvatar: 'https://yt3.googleusercontent.com/ytc/AIdro_k4qY6p9uX7F4d6T_N4e3_m8v8X=s176-c-k-c0x00ffffff-no-rj'

    const INITIAL_BRANDS = ['Soktas', 'Raymond', 'Siyaram', 'Solino', 'D&J', 'Birla Century', 'Linen Club', 'Generic'];
    const INITIAL_CATEGORIES = ['Shirting', 'Pure Cotton', 'Pure Linen', 'Trouser', 'Pant Shirt Combo', 'Cotton Linen'];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [viewMode, setViewMode] = useState('store');
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [showAdminPinModal, setShowAdminPinModal] = useState(false);
      const [pinInput, setPinInput] = useState('');

      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [orders, setOrders] = useState(INITIAL_ORDERS);
      const [storeSettings, setStoreSettings] = useState(DEFAULT_STORE_SETTINGS);
      const [brandsList, setBrandsList] = useState(INITIAL_BRANDS);
      const [categoriesList, setCategoriesList] = useState(INITIAL_CATEGORIES);

      const [activeTab, setActiveTab] = useState('orders');
      const [cart, setCart] = useState([]);
      const [showCartDrawer, setShowCartDrawer] = useState(false);

      const [selectedVideo, setSelectedVideo] = useState('ALL');
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [selectedBrand, setSelectedBrand] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');

      // PDP & CRUD Modals
      const [selectedPdpProduct, setSelectedPdpProduct] = useState(null);
      const [whatsappModalProduct, setWhatsappModalProduct] = useState(null);
      const [orderQtyModal, setOrderQtyModal] = useState(1);
      const [selectedOrderForDrawer, setSelectedOrderForDrawer] = useState(null);
      const [editingProductRow, setEditingProductRow] = useState(null);
      const [stockAdjustProduct, setStockAdjustProduct] = useState(null);

      useEffect(() => {
        const savedProds = localStorage.getItem('ht_products');
        const savedOrders = localStorage.getItem('ht_orders');
        const savedSettings = localStorage.getItem('ht_settings');
        const savedBrands = localStorage.getItem('ht_brands');
        const savedCats = localStorage.getItem('ht_categories');
        const savedCart = localStorage.getItem('ht_cart');

        if (savedProds) setProducts(JSON.parse(savedProds));
        if (savedOrders) setOrders(JSON.parse(savedOrders));
        if (savedSettings) setStoreSettings(JSON.parse(savedSettings));
        if (savedBrands) setBrandsList(JSON.parse(savedBrands));
        if (savedCats) setCategoriesList(JSON.parse(savedCats));
        if (savedCart) setCart(JSON.parse(savedCart));
      }, []);

      const saveProductsState = (newProducts) => {
        setProducts(newProducts);
        localStorage.setItem('ht_products', JSON.stringify(newProducts));
      };

      const saveOrdersState = (newOrders) => {
        setOrders(newOrders);
        localStorage.setItem('ht_orders', JSON.stringify(newOrders));
      };

      const saveSettingsState = (newSettings) => {
        setStoreSettings(newSettings);
        localStorage.setItem('ht_settings', JSON.stringify(newSettings));
      };

      const addDynamicBrand = (newBrand) => {
        if (newBrand && !brandsList.includes(newBrand)) {
          const updated = [...brandsList, newBrand];
          setBrandsList(updated);
          localStorage.setItem('ht_brands', JSON.stringify(updated));
        }
      };

      const addDynamicCategory = (newCat) => {
        if (newCat && !categoriesList.includes(newCat)) {
          const updated = [...categoriesList, newCat];
          setCategoriesList(updated);
          localStorage.setItem('ht_categories', JSON.stringify(updated));
        }
      };

      const addToCart = (product, qty = 1) => {
        const existingIndex = cart.findIndex(item => item.product.id === product.id);
        let updated = [];
        if (existingIndex >= 0) {
          updated = cart.map((item, idx) => 
            idx === existingIndex ? { ...item, qty: item.qty + qty } : item
          );
        } else {
          updated = [...cart, { product, qty }];
        }
        setCart(updated);
        localStorage.setItem('ht_cart', JSON.stringify(updated));
        setShowCartDrawer(true);
      };

      const updateCartQty = (productId, newQty) => {
        const updated = newQty <= 0 ? cart.filter(item => item.product.id !== productId) : cart.map(item => item.product.id === productId ? { ...item, qty: newQty } : item);
        setCart(updated);
        localStorage.setItem('ht_cart', JSON.stringify(updated));
      };

      const handleSwitchMode = (mode) => {
        if (mode === 'oms' && !isAdminAuthenticated) {
          setShowAdminPinModal(true);
        } else {
          setViewMode(mode);
        }
      };

      const handleVerifyPin = (e) => {
        e.preventDefault();
        if (pinInput === storeSettings.adminPin) {
          setIsAdminAuthenticated(true);
          setShowAdminPinModal(false);
          setPinInput('');
          setViewMode('oms');
        } else {
          alert("Invalid Security PIN!");
        }
      };

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          if (!p.isActive) return false;
          if (selectedVideo !== 'ALL' && !p.featuredInVideos.includes(selectedVideo)) return false;
          if (selectedCategory !== 'ALL' && p.category !== selectedCategory) return false;
          if (selectedBrand !== 'ALL' && p.brand !== selectedBrand) return false;
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            return (
              p.name.toLowerCase().includes(q) || 
              p.fabricType.toLowerCase().includes(q) || 
              p.sku.toLowerCase().includes(q) ||
              (p.brand && p.brand.toLowerCase().includes(q))
            );
          }
          return true;
        });
      }, [products, selectedVideo, selectedCategory, selectedBrand, searchQuery]);

      const totalRevenue = useMemo(() => orders.reduce((sum, o) => sum + (o.amountPaid || 0), 0), [orders]);
      const pendingPayment = useMemo(() => orders.reduce((sum, o) => sum + (o.balanceAmount || 0), 0), [orders]);
      const readyToDispatchCount = useMemo(() => orders.filter(o => o.orderStatus === 'READY_TO_DISPATCH').length, [orders]);
      const lowStockCount = useMemo(() => products.filter(p => p.currentStock <= p.lowStockThreshold).length, [products]);

      return (
        <div class="min-h-screen flex flex-col bg-slate-50 text-slate-900">
          
          {/* STORE ANNOUNCEMENT BANNER */}
          {storeSettings.announcementBar && (
            <div class="bg-amber-500 text-black text-center text-xs font-semibold py-2 px-4 shadow-sm">
              {storeSettings.announcementBar}
            </div>
          )}

          {/* STORE.LINK STYLE MINIMALIST HEADER */}
          <header class="sticky top-0 z-40 bg-white border-b border-slate-200 px-4 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4 shadow-xs">
            <div class="flex items-center space-x-3 cursor-pointer" onClick={() => setViewMode('store')}>
              <div class="w-10 h-10 rounded-full overflow-hidden border border-slate-200 shadow-xs flex items-center justify-center bg-slate-100">
                <img src={storeSettings.youtubeAvatar} alt="Logo" class="w-full h-full object-cover" onError={(e) => { e.target.style.display='none'; }} />
                <span class="font-heading font-extrabold text-slate-800 text-sm">HT</span>
              </div>
              <div>

              </div>
            </div>

            {/* DUAL ROLE SWITCHER */}
            <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
              <button 
                onClick={() => handleSwitchMode('store')}
                class={`px-3.5 py-1.5 rounded-lg font-semibold text-xs transition ${
                  viewMode === 'store' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-900'
                }`}
              >
                🛍️ Storefront
              </button>
              <button 
                onClick={() => handleSwitchMode('oms')}
                class={`px-3.5 py-1.5 rounded-lg font-semibold text-xs transition ${
                  viewMode === 'oms' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-900'
                }`}
              >
                💼 OMS (Admin) {isAdminAuthenticated ? '✓' : '🔒'}
              </button>
            </div>

            <div class="flex items-center space-x-3">
              {viewMode === 'store' && (
                <button 
                  onClick={() => setShowCartDrawer(true)}
                  class="relative bg-slate-900 hover:bg-slate-800 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-2 shadow-xs"
                >
                  <span>🛒 Cart</span>
                  {cart.length > 0 && (
                    <span class="bg-amber-500 text-black text-[10px] font-extrabold px-1.5 py-0.5 rounded-full">
                      {cart.reduce((s,i)=>s+i.qty,0)}
                    </span>
                  )}
                </button>
              )}
            </div>
          </header>

          {/* MAIN BODY MODE */}
          {viewMode === 'store' ? (
            <StorefrontView 
              products={filteredProducts}
              allProducts={products}
              storeSettings={storeSettings}
              brandsList={brandsList}
              categoriesList={categoriesList}
              selectedVideo={selectedVideo}
              setSelectedVideo={setSelectedVideo}
              selectedCategory={selectedCategory}
              setSelectedCategory={setSelectedCategory}
              selectedBrand={selectedBrand}
              setSelectedBrand={setSelectedBrand}
              searchQuery={searchQuery}
              setSearchQuery={setSearchQuery}
              onSelectProductPdp={setSelectedPdpProduct}
              onAddToCart={(prod) => addToCart(prod, 1)}
              onQuickWhatsapp={(prod) => {
                setWhatsappModalProduct(prod);
                setOrderQtyModal(1);
              }}
            />
          ) : (
            <OmsView 
              activeTab={activeTab}
              setActiveTab={setActiveTab}
              orders={orders}
              saveOrdersState={saveOrdersState}
              products={products}
              saveProductsState={saveProductsState}
              storeSettings={storeSettings}
              saveSettingsState={saveSettingsState}
              brandsList={brandsList}
              categoriesList={categoriesList}
              addDynamicBrand={addDynamicBrand}
              addDynamicCategory={addDynamicCategory}
              totalRevenue={totalRevenue}
              pendingPayment={pendingPayment}
              readyToDispatchCount={readyToDispatchCount}
              lowStockCount={lowStockCount}
              setSelectedOrderForDrawer={setSelectedOrderForDrawer}
              setEditingProductRow={setEditingProductRow}
              setStockAdjustProduct={setStockAdjustProduct}
            />
          )}

                <div class="text-center space-y-1">
                  <div class="w-12 h-12 rounded-2xl bg-amber-100 mx-auto flex items-center justify-center text-amber-700 text-2xl font-bold">🔒</div>
                  <h3 class="font-heading font-bold text-lg text-slate-900">Owner Access Verification</h3>
                  <p class="text-xs text-slate-500">Enter Admin Security PIN (Default: 1974)</p>
                </div>
                <input 
                  type="password" 
                  placeholder="Security PIN" 
                  value={pinInput} 
                  onChange={e => setPinInput(e.target.value)} 
                  class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-center text-lg font-bold tracking-widest text-slate-900 focus:outline-none focus:border-amber-500" 
                  autoFocus 
                />
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl text-xs shadow-sm">
                  Unlock Admin Controls
                </button>
                <button type="button" onClick={() => setShowAdminPinModal(false)} class="w-full text-xs text-slate-500 font-medium">Cancel</button>
              </form>
            </div>
          )}

          {/* PRODUCT DETAIL PAGE (PDP MODAL - STORE.LINK STYLE) */}
          {selectedPdpProduct && (
            <ProductDetailPageModal 
              product={selectedPdpProduct}
              storeSettings={storeSettings}
              onClose={() => setSelectedPdpProduct(null)}
              onAddToCart={(prod, qty) => addToCart(prod, qty)}
            />
          )}

          {/* SHOPPING CART DRAWER */}
          {showCartDrawer && (
            <CartDrawer 
              cart={cart}
              storeSettings={storeSettings}
              updateCartQty={updateCartQty}
              onClose={() => setShowCartDrawer(false)}
              onClearCart={() => setCart([])}
            />
          )}

          {/* QUICK WHATSAPP MODAL */}
          {whatsappModalProduct && (
            <WhatsAppModal 
              product={whatsappModalProduct}
              qty={orderQtyModal}
              setQty={setOrderQtyModal}
              storeSettings={storeSettings}
              onClose={() => setWhatsappModalProduct(null)}
            />
          )}

          {/* HOLISTIC EDIT PRODUCT ROW MODAL (WITH IMAGE UPLOADER & DYNAMIC BRANDS) */}
          {editingProductRow && (
            <EditProductModal 
              product={editingProductRow}
              brandsList={brandsList}
              categoriesList={categoriesList}
              addDynamicBrand={addDynamicBrand}
              addDynamicCategory={addDynamicCategory}
              onClose={() => setEditingProductRow(null)}
              onSave={(updatedProduct) => {
                const updated = products.map(p => p.id === updatedProduct.id ? updatedProduct : p);
                saveProductsState(updated);
                setEditingProductRow(null);
              }}
            />
          )}

          {/* STOCK ADJUSTMENT MODAL */}
          {stockAdjustProduct && (
            <StockAdjustModal 
              product={stockAdjustProduct}
              onClose={() => setStockAdjustProduct(null)}
              onAdjust={(productId, delta) => {
                const updated = products.map(p => p.id === productId ? { ...p, currentStock: Math.max(0, p.currentStock + delta) } : p);
                saveProductsState(updated);
                setStockAdjustProduct(null);
              }}
            />
          )}

        </div>
      );
    }

        return `https://wa.me/${storeSettings.whatsappPhone}?text=${encodeURIComponent(msg)}`;

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          {orders.map(order => (

    // --- HOLISTIC PRODUCT CRUD WITH DYNAMIC BRANDS & IMAGE PICKER ---
    function OmsHolisticProductsTab({ products, saveProductsState, brandsList, categoriesList, addDynamicBrand, addDynamicCategory, onEditRow, onAdjustStock }) {
      const [showAddModal, setShowAddModal] = useState(false);
      const [newProdName, setNewProdName] = useState('');
      const [newProdBrand, setNewProdBrand] = useState(brandsList[0] || 'Soktas');
      const [customBrandInput, setCustomBrandInput] = useState('');
      const [isAddingCustomBrand, setIsAddingCustomBrand] = useState(false);

      const [newProdCategory, setNewProdCategory] = useState(categoriesList[0] || 'Shirting');
      const [newProdPrice, setNewProdPrice] = useState(800);
      const [newProdMrp, setNewProdMrp] = useState(1500);
      const [newProdStock, setNewProdStock] = useState(30);
      const [newProdImg, setNewProdImg] = useState(PRESET_FABRIC_IMAGES[0].url);

      const handleAddProduct = (e) => {
        e.preventDefault();
        let targetBrand = newProdBrand;
        if (isAddingCustomBrand && customBrandInput.trim()) {
          targetBrand = customBrandInput.trim();
          addDynamicBrand(targetBrand);
        }

        const created = {
          id: `prod-${products.length + 1}`,
          sku: `HT-NEW-${100 + products.length}`,
          name: newProdName,
          brand: targetBrand,
          category: newProdCategory,
          fabricType: '100% Cotton',
          mrpPrice: Number(newProdMrp),
          sellingPrice: Number(newProdPrice),
          unit: 'pc',
          currentStock: Number(newProdStock),
          lowStockThreshold: 8,
          featuredInVideos: ['Video no 18'],
          imageUrl: newProdImg,
          galleryImages: [newProdImg],
          isActive: true,
          description: 'New fabric stock item.'
        };
        saveProductsState([created, ...products]);
        setShowAddModal(false);
      };

      const toggleProductActive = (productId) => {
        const updated = products.map(p => p.id === productId ? { ...p, isActive: !p.isActive } : p);
        saveProductsState(updated);
      };

      const duplicateProductRow = (product) => {
        const cloned = { ...product, id: `prod-${products.length + 1}`, sku: `${product.sku}-COPY`, name: `${product.name} (Variant)` };
        saveProductsState([cloned, ...products]);
      };

      const deleteProductRow = (productId) => {
        if (confirm("Archive this fabric item?")) saveProductsState(products.filter(p => p.id !== productId));
      };

      return (
        <div class="space-y-6">
          <div class="flex justify-between items-center">
            <h3 class="font-heading font-bold text-lg text-slate-900">Inventory Master (With Image Uploader & Dynamic Brands)</h3>
            <button onClick={() => setShowAddModal(true)} class="bg-slate-900 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-xs">
              + Add New Inventory Row
            </button>
          </div>

          {/* ADD PRODUCT MODAL */}
          {showAddModal && (
            <form onSubmit={handleAddProduct} class="bg-white border border-slate-200 p-5 rounded-2xl space-y-4 shadow-md max-w-2xl">
              <h4 class="font-heading font-bold text-slate-900 text-sm border-b pb-2">Add Fabric Inventory Row</h4>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                <div class="sm:col-span-2">
                  <label class="text-slate-600 font-semibold">Fabric Name</label>
                  <input type="text" required value={newProdName} onChange={e=>setNewProdName(e.target.value)} class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 font-bold" />
                </div>
                
                {/* DYNAMIC BRAND SELECTOR */}
                <div>
                  <label class="text-slate-600 font-semibold">Brand</label>
                  {!isAddingCustomBrand ? (
                    <div class="flex space-x-1.5 mt-1">
                      <select value={newProdBrand} onChange={e=>setNewProdBrand(e.target.value)} class="flex-1 bg-slate-50 border border-slate-300 rounded-lg p-2">
                        {brandsList.map(b=><option key={b} value={b}>{b}</option>)}
                      </select>
                      <button type="button" onClick={() => setIsAddingCustomBrand(true)} class="bg-amber-100 text-amber-800 font-bold px-2 py-1 rounded-lg text-[11px]">
                        + New
                      </button>
                    </div>
                  ) : (
                    <div class="flex space-x-1.5 mt-1">
                      <input type="text" placeholder="Type Brand Name..." value={customBrandInput} onChange={e=>setCustomBrandInput(e.target.value)} class="flex-1 bg-slate-50 border border-slate-300 rounded-lg p-2 font-bold text-slate-900" />
                      <button type="button" onClick={() => setIsAddingCustomBrand(false)} class="text-xs text-slate-400">Cancel</button>
                    </div>
                  )}
                </div>

                <div>
                  <label class="text-slate-600 font-semibold">Category</label>
                  <select value={newProdCategory} onChange={e=>setNewProdCategory(e.target.value)} class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 mt-1">
                    {categoriesList.map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                </div>

                <div><label class="text-slate-600 font-semibold">Selling Price (₹)</label><input type="number" required value={newProdPrice} onChange={e=>setNewProdPrice(e.target.value)} class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 mt-1 font-bold" /></div>
                <div><label class="text-slate-600 font-semibold">MRP Price (₹)</label><input type="number" value={newProdMrp} onChange={e=>setNewProdMrp(e.target.value)} class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 mt-1" /></div>
                
                {/* IMAGE URL & PRESET PICKER */}
                <div class="sm:col-span-2 space-y-2">
                  <label class="text-slate-600 font-semibold">Fabric Photo URL</label>
                  <div class="flex space-x-2">
                    <input type="text" value={newProdImg} onChange={e=>setNewProdImg(e.target.value)} class="flex-1 bg-slate-50 border border-slate-300 rounded-lg p-2 font-mono text-[11px]" />
                    <img src={newProdImg} class="w-9 h-9 rounded-lg object-cover border border-slate-300 shrink-0" />
                  </div>

                  <div class="text-[10px] text-slate-500">Or Select from Preset Fabric Photos:</div>
                  <div class="flex space-x-2 overflow-x-auto pb-1 custom-scrollbar">
                    {PRESET_FABRIC_IMAGES.map((preset, i) => (
                      <img key={i} src={preset.url} onClick={() => setNewProdImg(preset.url)} class={`w-10 h-10 rounded-lg object-cover cursor-pointer border-2 ${newProdImg === preset.url ? 'border-amber-500' : 'border-slate-200'}`} title={preset.name} />
                    ))}
                  </div>
                </div>
              </div>

              <div class="flex justify-end space-x-2 pt-2 border-t">
                <button type="button" onClick={() => setShowAddModal(false)} class="px-3 py-1.5 bg-slate-100 text-slate-700 text-xs rounded-lg">Cancel</button>
                <button type="submit" class="px-4 py-1.5 bg-slate-900 text-white font-bold text-xs rounded-lg">Save Inventory Item</button>
              </div>
            </form>
          )}

          {/* TABLE */}
          <div class="bg-white border border-slate-200 rounded-2xl overflow-x-auto shadow-xs">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-100 text-slate-600 font-semibold uppercase border-b">
                <tr>
                  <th class="p-3">Photo</th>
                  <th class="p-3">Product / SKU</th>
                  <th class="p-3">Brand</th>
                  <th class="p-3">Price</th>
                  <th class="p-3">Stock</th>
                  <th class="p-3">Visibility</th>
                  <th class="p-3 text-right">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y text-slate-800">
                {products.map(p => (
                  <tr key={p.id} class={`hover:bg-slate-50 ${!p.isActive ? 'opacity-50' : ''}`}>
                    <td class="p-2.5"><img src={p.imageUrl} class="w-10 h-10 rounded-lg object-cover border" /></td>
                    <td class="p-3 font-bold text-slate-900">{p.name}<div class="text-[10px] text-slate-400 font-mono">SKU: {p.sku}</div></td>
                    <td class="p-3 font-semibold text-slate-700">{p.brand}</td>
                    <td class="p-3 font-bold text-slate-900">₹{p.sellingPrice}</td>
                    <td class="p-3">
                      <span class="font-bold">{p.currentStock} {p.unit}</span>
                      <button onClick={() => onAdjustStock(p)} class="ml-2 text-[10px] bg-slate-100 border px-1.5 py-0.5 rounded">+/-</button>
                    </td>
                    <td class="p-3">
                      <button onClick={() => toggleProductActive(p.id)} class={`px-2.5 py-1 rounded text-[10px] font-bold ${p.isActive ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500'}`}>
                        {p.isActive ? '👁️ Visible' : '🙈 Hidden'}
                      </button>
                    </td>
                    <td class="p-3 text-right space-x-1">
                      <button onClick={() => onEditRow(p)} class="bg-slate-100 text-slate-900 px-2 py-1 rounded text-[10px] font-semibold">✏️ Edit</button>
                      <button onClick={() => duplicateProductRow(p)} class="bg-slate-100 text-slate-700 px-2 py-1 rounded text-[10px]">📋 Clone</button>
                      <button onClick={() => deleteProductRow(p.id)} class="bg-red-50 text-red-600 px-2 py-1 rounded text-[10px]">🗑️</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- HOLISTIC EDIT MODAL WITH IMAGE UPLOADER & DYNAMIC BRANDS ---
    function EditProductModal({ product, brandsList, categoriesList, addDynamicBrand, addDynamicCategory, onClose, onSave }) {
      const [form, setForm] = useState({ ...product });
      const [newCustomBrand, setNewCustomBrand] = useState('');
      const [isAddingBrand, setIsAddingBrand] = useState(false);

      const handleSave = (e) => {
        e.preventDefault();
        let targetBrand = form.brand;
        if (isAddingBrand && newCustomBrand.trim()) {
          targetBrand = newCustomBrand.trim();
          addDynamicBrand(targetBrand);
        }
        onSave({ ...form, brand: targetBrand });
      };

      return (
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <form onSubmit={handleSave} class="bg-white border border-slate-200 rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3">
              <h3 class="font-heading font-bold text-lg text-slate-900">Edit Inventory Item Row</h3>
              <button type="button" onClick={onClose} class="text-slate-400">✕</button>
            </div>

            <div class="grid grid-cols-2 gap-3 text-xs">
              <div class="col-span-2">
                <label class="text-slate-600 font-semibold">Product Name</label>
                <input type="text" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-900 font-bold" />
              </div>

              <div>
                <label class="text-slate-600 font-semibold">Brand</label>
                {!isAddingBrand ? (
                  <div class="flex space-x-1 mt-1">
                    <select value={form.brand} onChange={e => setForm({ ...form, brand: e.target.value })} class="flex-1 bg-slate-50 border border-slate-300 rounded-lg p-2">
                      {brandsList.map(b=><option key={b} value={b}>{b}</option>)}
                    </select>
                    <button type="button" onClick={() => setIsAddingBrand(true)} class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 rounded-lg">+ Custom</button>
                  </div>
                ) : (
                  <div class="flex space-x-1 mt-1">
                    <input type="text" placeholder="Custom Brand..." value={newCustomBrand} onChange={e => setNewCustomBrand(e.target.value)} class="flex-1 bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-900 font-bold" />
                    <button type="button" onClick={() => setIsAddingBrand(false)} class="text-xs text-slate-400">Cancel</button>
                  </div>
                )}
              </div>

              <div><label class="text-slate-600 font-semibold">Selling Price (₹)</label><input type="number" value={form.sellingPrice} onChange={e => setForm({ ...form, sellingPrice: Number(e.target.value) })} class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 font-bold" /></div>
              <div><label class="text-slate-600 font-semibold">MRP Price (₹)</label><input type="number" value={form.mrpPrice || ''} onChange={e => setForm({ ...form, mrpPrice: Number(e.target.value) })} class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2" /></div>
              <div><label class="text-slate-600 font-semibold">Stock Quantity</label><input type="number" value={form.currentStock} onChange={e => setForm({ ...form, currentStock: Number(e.target.value) })} class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2" /></div>

              {/* IMAGE URL & LIVE PREVIEW */}
              <div class="col-span-2 space-y-2">
                <label class="text-slate-600 font-semibold">Fabric Photo URL</label>
                <div class="flex space-x-2">
                  <input type="text" value={form.imageUrl} onChange={e => setForm({ ...form, imageUrl: e.target.value })} class="flex-1 bg-slate-50 border border-slate-300 rounded-lg p-2 font-mono text-[11px]" />
                  <img src={form.imageUrl} class="w-10 h-10 rounded-lg object-cover border" />
                </div>
                <div class="text-[10px] text-slate-500">Pick Preset Photo:</div>
                <div class="flex space-x-2 overflow-x-auto pb-1 custom-scrollbar">
                  {PRESET_FABRIC_IMAGES.map((preset, i) => (
                    <img key={i} src={preset.url} onClick={() => setForm({ ...form, imageUrl: preset.url })} class={`w-9 h-9 rounded-lg object-cover cursor-pointer border-2 ${form.imageUrl === preset.url ? 'border-amber-500' : 'border-slate-200'}`} />
                  ))}
                </div>
              </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2 border-t">
              <button type="button" onClick={onClose} class="px-4 py-2 bg-slate-100 text-xs text-slate-700 rounded-xl">Cancel</button>
              <button type="submit" class="px-5 py-2 bg-slate-900 text-white font-bold text-xs rounded-xl shadow-xs">Save Changes</button>
            </div>
          </form>
        </div>
      );
    }

    function OmsWebsiteCustomizerTab({ storeSettings, saveSettingsState }) {
      const [formData, setFormData] = useState(storeSettings);
      const [savedToast, setSavedToast] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        saveSettingsState(formData);
        setSavedToast(true);
        setTimeout(() => setSavedToast(false), 2000);
      };

      return (
        <form onSubmit={handleSubmit} class="max-w-2xl mx-auto bg-white border border-slate-200 rounded-3xl p-6 space-y-4 shadow-xs">
          <div class="flex justify-between border-b pb-3">
            <h3 class="font-heading font-bold text-lg text-slate-900">DIY Website Customizer</h3>
            {savedToast && <span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-3 py-1 rounded-full">Saved ✓</span>}
          </div>
          <div class="space-y-3 text-xs">
            <div><label class="text-slate-600 font-semibold">Store Header Title</label><input type="text" value={formData.storeName} onChange={e=>setFormData({...formData, storeName:e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-bold" /></div>
            <div><label class="text-slate-600 font-semibold">Announcement Bar Text</label><input type="text" value={formData.announcementBar} onChange={e=>setFormData({...formData, announcementBar:e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5" /></div>
            <div><label class="text-slate-600 font-semibold">WhatsApp Phone Number</label><input type="text" value={formData.whatsappPhone} onChange={e=>setFormData({...formData, whatsappPhone:e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono" /></div>
            <div><label class="text-slate-600 font-semibold">YouTube Avatar Image URL</label><input type="text" value={formData.youtubeAvatar} onChange={e=>setFormData({...formData, youtubeAvatar:e.target.value})} class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 font-mono" /></div>
          </div>
          <button type="submit" class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl text-xs">Save Store Customizations</button>
        </form>
      );
    }

    function OmsCsvImportAndDedupeTab({ orders, saveOrdersState }) {
      const [parsedDiff, setParsedDiff] = useState(null);

      const handleParseCsvText = (csvContent) => {
        const lines = csvContent.split(/\r?\n/).filter(line => line.trim().length > 0);
        if (lines.length <= 1) return;
        const newItems = [];
        const startIdx = lines[0].toUpperCase().includes('NAME') ? 1 : 0;

        for (let i = startIdx; i < lines.length; i++) {
          const cols = lines[i].split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
          if (cols.length < 3) continue;

          const orderObj = {
            id: `HT-${1000 + orders.length + newItems.length + 1}`,
            ie: parseInt(cols[0]) || (orders.length + i),
            date: cols[3] || 'Today',
            customer: { name: cols[1] || 'Customer', phone: cols[2] || '', address: cols[7] || 'Local' },
            videoAttribution: cols[4] || 'Video no 18',
            fabricDescription: cols[5] || 'Fabric',
            quantity: cols[6] || '2 pc',
            totalAmount: parseInt(cols[8]?.replace(/[^0-9]/g, '')) || 1600,
            amountPaid: parseInt(cols[8]?.replace(/[^0-9]/g, '')) || 1600,
            balanceAmount: 0,
            paymentStatus: 'PAID',
            orderStatus: 'CONFIRMED'
          };
          newItems.push(orderObj);
        }
        setParsedDiff({ newItems, totalParsed: lines.length - startIdx });
      };

      return (
        <div class="space-y-4 bg-white border border-slate-200 p-6 rounded-3xl">
          <h3 class="font-heading font-bold text-lg text-slate-900">CSV File Importer & Smart Deduplication</h3>
          <input type="file" accept=".csv" onChange={(e)=>{ const f=e.target.files[0]; if(f){ const r=new FileReader(); r.onload=evt=>handleParseCsvText(evt.target.result); r.readAsText(f); }}} class="text-xs" />
          {parsedDiff && (
            <div class="space-y-2 pt-2">
              <div class="text-xs font-bold text-emerald-700">Parsed {parsedDiff.newItems.length} new unique orders.</div>
              <button onClick={() => { saveOrdersState([...parsedDiff.newItems, ...orders]); setParsedDiff(null); alert("Synced!"); }} class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl text-xs">Confirm Sync</button>
            </div>
          )}
        </div>
      );
    }

    function StockAdjustModal({ product, onClose, onAdjust }) {
      const [delta, setDelta] = useState(5);
      return (
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div class="bg-white border border-slate-200 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-xl">
            <h3 class="font-heading font-bold text-lg text-slate-900">Adjust Stock Level</h3>
            <div class="flex items-center space-x-3 justify-center py-2">
              <button onClick={() => setDelta(d => d - 1)} class="w-10 h-10 bg-slate-100 font-bold text-lg rounded-xl text-slate-900">-</button>
              <input type="number" value={delta} onChange={e => setDelta(Number(e.target.value))} class="w-20 bg-slate-50 border rounded-xl p-2.5 text-center font-bold text-slate-900" />
              <button onClick={() => setDelta(d => d + 1)} class="w-10 h-10 bg-slate-100 font-bold text-lg rounded-xl text-slate-900">+</button>
            </div>
            <div class="flex space-x-2">
              <button onClick={() => onAdjust(product.id, -Math.abs(delta))} class="flex-1 bg-red-100 text-red-700 font-bold py-2 rounded-xl text-xs">- Remove {delta}</button>
              <button onClick={() => onAdjust(product.id, Math.abs(delta))} class="flex-1 bg-emerald-100 text-emerald-800 font-bold py-2 rounded-xl text-xs">+ Add {delta}</button>
            </div>
            <button onClick={onClose} class="w-full text-xs text-slate-400 py-1 font-medium">Cancel</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
