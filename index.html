        const savedCats = localStorage.getItem('ht_categories');
        const savedCart = localStorage.getItem('ht_cart');

        if (savedOrders) setOrders(JSON.parse(savedOrders));
        if (savedSettings) setStoreSettings(JSON.parse(savedSettings));
        if (savedBrands) setBrandsList(JSON.parse(savedBrands));
        if (savedCats) setCategoriesList(JSON.parse(savedCats));
        if (savedCart) setCart(JSON.parse(savedCart));
      }, []);

      const saveProductsState = (newProducts) => {
        setProducts(newProducts);
        localStorage.setItem('ht_products', JSON.stringify(newProducts));
      };

      const saveOrdersState = (newOrders) => {
        setOrders(newOrders);
        localStorage.setItem('ht_orders', JSON.stringify(newOrders));
      };

      const saveSettingsState = (newSettings) => {
        setStoreSettings(newSettings);
        localStorage.setItem('ht_settings', JSON.stringify(newSettings));
      };

      const addDynamicBrand = (newBrand) => {
        if (newBrand && !brandsList.includes(newBrand)) {
          const updated = [...brandsList, newBrand];
          setBrandsList(updated);
          localStorage.setItem('ht_brands', JSON.stringify(updated));
        }
      };

      const addDynamicCategory = (newCat) => {
        if (newCat && !categoriesList.includes(newCat)) {
          const updated = [...categoriesList, newCat];
          setCategoriesList(updated);
          localStorage.setItem('ht_categories', JSON.stringify(updated));
        }
      };

      const addToCart = (product, qty = 1) => {
        const existingIndex = cart.findIndex(item => item.product.id === product.id);
        let updated = [];
        if (existingIndex >= 0) {
          updated = cart.map((item, idx) => 
            idx === existingIndex ? { ...item, qty: item.qty + qty } : item
          );
        } else {
          updated = [...cart, { product, qty }];
        }
        setCart(updated);
        localStorage.setItem('ht_cart', JSON.stringify(updated));
        setShowCartDrawer(true);
      };

      const updateCartQty = (productId, newQty) => {
        const updated = newQty <= 0 ? cart.filter(item => item.product.id !== productId) : cart.map(item => item.product.id === productId ? { ...item, qty: newQty } : item);
        setCart(updated);
        localStorage.setItem('ht_cart', JSON.stringify(updated));
      };

        if (mode === 'oms' && !isAdminAuthenticated) {
          setShowAdminPinModal(true);
        } else {
          setViewMode(mode);
        }

          setShowAdminPinModal(false);
          setPinInput('');
          setViewMode('oms');

        return products.filter(p => {
          if (!p.isActive) return false;
          if (selectedVideo !== 'ALL' && !p.featuredInVideos.includes(selectedVideo)) return false;

              p.name.toLowerCase().includes(q) || 
              p.fabricType.toLowerCase().includes(q) || 
              p.sku.toLowerCase().includes(q) ||
              (p.brand && p.brand.toLowerCase().includes(q))

          }
          return true;
        });

                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3 rounded-xl text-xs transition shadow">
                  Unlock Admin Access
                </button>
                <button type="button" onClick={() => setShowAdminPinModal(false)} class="w-full bg-zinc-800 text-zinc-400 py-2 rounded-xl text-xs font-medium">Cancel</button>
              </form>
            </div>
          )}

          {/* PRODUCT DETAIL PAGE (PDP MODAL) */}
          {selectedPdpProduct && (
            <ProductDetailPageModal 
              product={selectedPdpProduct}
              storeSettings={storeSettings}
              onClose={() => setSelectedPdpProduct(null)}
              onAddToCart={(prod, qty) => addToCart(prod, qty)}
            />
          )}

          {/* CART DRAWER */}
          {showCartDrawer && (
            <CartDrawer 
              cart={cart}
              storeSettings={storeSettings}
              updateCartQty={updateCartQty}
              onClose={() => setShowCartDrawer(false)}
              onClearCart={() => setCart([])}
            />
          )}

          {/* QUICK WHATSAPP MODAL */}
          {whatsappModalProduct && (
            <WhatsAppModal 
              product={whatsappModalProduct}
              qty={orderQtyModal}
              setQty={setOrderQtyModal}
              storeSettings={storeSettings}
              onClose={() => setWhatsappModalProduct(null)}
            />
          )}

          {/* ORDER DETAIL DRAWER */}
          {selectedOrderForDrawer && (
            <OrderDetailModal 
              order={selectedOrderForDrawer}
              onClose={() => setSelectedOrderForDrawer(null)}
              onUpdateStatus={(orderId, newStatus) => {
                const updated = orders.map(o => o.id === orderId ? { ...o, orderStatus: newStatus } : o);
                saveOrdersState(updated);
                setSelectedOrderForDrawer(prev => ({ ...prev, orderStatus: newStatus }));
              }}
            />
          )}

          {/* EDIT PRODUCT ROW MODAL (MULTI-IMAGE THUMBNAIL MANAGER) */}
          {editingProductRow && (
            <EditProductModal 
              product={editingProductRow}
              brandsList={brandsList}
              categoriesList={categoriesList}
              addDynamicBrand={addDynamicBrand}
              addDynamicCategory={addDynamicCategory}
              onClose={() => setEditingProductRow(null)}
              onSave={(updatedProduct) => {
                const updated = products.map(p => p.id === updatedProduct.id ? updatedProduct : p);
                saveProductsState(updated);
                setEditingProductRow(null);
              }}
            />
          )}

          {/* STOCK ADJUSTMENT MODAL */}
          {stockAdjustProduct && (
            <StockAdjustModal 
              product={stockAdjustProduct}
              onClose={() => setStockAdjustProduct(null)}
              onAdjust={(productId, delta) => {
                const updated = products.map(p => p.id === productId ? { ...p, currentStock: Math.max(0, p.currentStock + delta) } : p);
                saveProductsState(updated);
                setStockAdjustProduct(null);
              }}
            />
          )}

        </div>
      );
    }

    function ProductCard({ product, onClickPdp, onAddToCart, onQuickWhatsapp }) {

              </div>
              <h4 class="font-heading font-bold text-lg text-white group-hover:text-amber-400 transition">{product.name}</h4>

                <div class="flex items-baseline space-x-1.5">

    // --- PRODUCT DETAIL PAGE MODAL ---

            </div>

    function CartDrawer({ cart, storeSettings, updateCartQty, onClose, onClearCart }) {
      const totalAmount = cart.reduce((sum, item) => sum + (item.product.sellingPrice * item.qty), 0);

      const generateCombinedWhatsapp = () => {
        let msg = `Hi Humjoly Tailors, I would like to order the following fabrics:\n\n`;
        cart.forEach((item, idx) => {
          msg += `${idx + 1}. *${item.product.name}*\n   📏 Qty: ${item.qty} ${item.product.unit}\n   💵 Price: ₹${item.product.sellingPrice * item.qty}\n`;
        });
        msg += `\n💰 *Total Order Value*: ₹${totalAmount}\n\nPlease confirm availability and payment details.`;
        return `https://wa.me/${storeSettings.whatsappPhone}?text=${encodeURIComponent(msg)}`;
      };

      return (
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex justify-end">
          <div class="bg-zinc-900 border-l border-zinc-800 max-w-md w-full h-full p-6 flex flex-col justify-between shadow-2xl">

              <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
                <h3 class="font-heading font-bold text-xl text-white">Your Cart ({cart.reduce((s,i)=>s+i.qty,0)})</h3>
                <button onClick={onClose} class="text-zinc-400 hover:text-white text-xl">✕</button>
              </div>

              {cart.length === 0 ? (
                <div class="text-center py-12 text-zinc-400 text-xs">Your fabric cart is empty.</div>
              ) : (
                <div class="space-y-3 max-h-[60vh] overflow-y-auto custom-scrollbar pr-1">
                  {cart.map((item) => (
                    <div key={item.product.id} class="bg-zinc-950 p-3 rounded-2xl border border-zinc-800 flex space-x-3 items-center justify-between">
                      <img src={item.product.imageUrl} class="w-14 h-14 rounded-xl object-cover" />
                      <div class="flex-1 min-w-0">
                        <h4 class="font-heading font-bold text-xs text-white truncate">{item.product.name}</h4>
                        <div class="text-xs text-amber-400 font-semibold mt-0.5">₹{item.product.sellingPrice} / {item.product.unit}</div>
                      </div>
                      <div class="flex items-center space-x-2 bg-zinc-900 px-2 py-1 rounded-lg border border-zinc-800">
                        <button onClick={() => updateCartQty(item.product.id, item.qty - 1)} class="text-amber-400 font-bold px-1 text-xs">-</button>
                        <span class="text-xs font-bold text-white w-4 text-center">{item.qty}</span>
                        <button onClick={() => updateCartQty(item.product.id, item.qty + 1)} class="text-amber-400 font-bold px-1 text-xs">+</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {cart.length > 0 && (
              <div class="space-y-3 border-t border-zinc-800 pt-4">
                <div class="flex justify-between items-baseline">
                  <span class="text-xs text-zinc-400">Total Order Value:</span>
                  <span class="text-2xl font-extrabold text-amber-400 font-heading">₹{totalAmount}</span>
                </div>
                <a href={generateCombinedWhatsapp()} target="_blank" rel="noreferrer" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl text-center block text-sm shadow">
                  Send Combined Order on WhatsApp 🚀
                </a>
              </div>
            )}
          </div>
        </div>
      );
    }

    function WhatsAppModal({ product, qty, setQty, storeSettings, onClose }) {
      const totalPrice = product.sellingPrice * qty;
      const whatsappText = `Hi Humjoly Tailors, I want to order:\n\n🧵 *Product*: ${product.name}\n🔖 *SKU*: ${product.sku}\n📏 *Quantity*: ${qty} ${product.unit}\n💵 *Total Price*: ₹${totalPrice}\n\nPlease confirm availability.`;

        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="bg-zinc-900 border border-zinc-700 rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl">

              <button onClick={onClose} class="text-zinc-400">✕</button>

            <div class="flex space-x-3 bg-zinc-950 p-3 rounded-2xl border border-zinc-800">

          )}

            <OmsCsvImportAndDedupeTab orders={orders} saveOrdersState={saveOrdersState} />

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {orders.map(order => (
              <div key={order.id} onClick={() => onSelectOrder(order)} class="bg-zinc-900 border border-zinc-800 hover:border-amber-500/40 p-5 rounded-2xl cursor-pointer space-y-3">
                <div class="flex items-center justify-between">
                  <span class="font-heading font-extrabold text-amber-400 text-sm">{order.id}</span>
                  <span class="text-[10px] font-bold uppercase bg-zinc-800 text-amber-300 px-2 py-0.5 rounded">{order.orderStatus}</span>
                </div>
                <div>
                  <h4 class="font-heading font-bold text-white text-base">{order.customer.name}</h4>
                  <p class="text-xs text-zinc-400">📞 {order.customer.phone}</p>
                </div>
                <div class="flex justify-between text-xs pt-2 border-t border-zinc-800">
                  <span class="text-zinc-400">{order.fabricDescription}</span>
                  <span class="font-bold text-white">₹{order.totalAmount}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function OmsCreateOrderTab({ products, orders, saveOrdersState, onSuccess }) {
      const [entryType, setEntryType] = useState('ai');
      const [aiScanning, setAiScanning] = useState(false);
      const [extractedDraft, setExtractedDraft] = useState(null);

      const [custName, setCustName] = useState('');
      const [custPhone, setCustPhone] = useState('');
      const [custAddress, setCustAddress] = useState('');
      const [videoCode, setVideoCode] = useState('Video no 18');
      const [selectedProdId, setSelectedProdId] = useState(products[0]?.id || '');
      const [qty, setQty] = useState(2);

      const handleSimulateAiUpload = () => {
        setAiScanning(true);
        setTimeout(() => {
          setAiScanning(false);
          setExtractedDraft({
            customerName: 'Atish Kumar',
            phoneNumber: '9885616510',
            address: 'Government Junior College Thunkul, AP',
            videoAttribution: 'Video no 13',
            fabricDescription: 'Soktas shirt checks',
            quantity: '2 pc',
            totalAmount: 1600,
            amountPaid: 1600
          });
        }, 1200);
      };

      const handleConfirmAiDraft = () => {
        if (!extractedDraft) return;
        const newOrder = {
          id: `HT-${1000 + orders.length + 1}`,
          ie: orders.length + 1,
          date: new Date().toLocaleDateString('en-GB'),
          customer: { name: extractedDraft.customerName, phone: extractedDraft.phoneNumber, address: extractedDraft.address },
          videoAttribution: extractedDraft.videoAttribution,
          fabricDescription: extractedDraft.fabricDescription,
          quantity: extractedDraft.quantity,
          totalAmount: extractedDraft.totalAmount,
          amountPaid: extractedDraft.amountPaid,
          balanceAmount: 0,
          paymentStatus: 'PAID',
          orderStatus: 'CONFIRMED',
          source: 'WhatsApp Direct'
        };
        saveOrdersState([newOrder, ...orders]);
        onSuccess();
      };

      const handleCreateManualOrder = (e) => {
        e.preventDefault();
        const selProd = products.find(p => p.id === selectedProdId);
        const total = (selProd?.sellingPrice || 800) * qty;
        const newOrder = {
          id: `HT-${1000 + orders.length + 1}`,
          ie: orders.length + 1,
          date: new Date().toLocaleDateString('en-GB'),
          customer: { name: custName, phone: custPhone, address: custAddress },
          videoAttribution: videoCode,
          fabricDescription: selProd ? selProd.name : 'Custom Fabric',
          quantity: `${qty} pc`,
          totalAmount: total,
          amountPaid: total,
          balanceAmount: 0,
          paymentStatus: 'PAID',
          orderStatus: 'CONFIRMED',
          source: 'Manual Entry'
        };
        saveOrdersState([newOrder, ...orders]);
        onSuccess();
      };

      return (
        <div class="max-w-3xl mx-auto space-y-6">
          <div class="bg-zinc-900 p-2 rounded-2xl border border-zinc-800 flex space-x-2">
            <button onClick={() => setEntryType('ai')} class={`flex-1 py-3 rounded-xl font-heading font-bold text-xs ${entryType === 'ai' ? 'bg-amber-500 text-black shadow' : 'text-zinc-400'}`}>🤖 AI Screenshot / Video Upload</button>
            <button onClick={() => setEntryType('manual')} class={`flex-1 py-3 rounded-xl font-heading font-bold text-xs ${entryType === 'manual' ? 'bg-amber-500 text-black shadow' : 'text-zinc-400'}`}>✍️ Manual Order Form</button>
          </div>

          {entryType === 'ai' ? (
            <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 space-y-4">
              <h3 class="font-heading font-bold text-xl text-white">Gemini AI Order OCR Parser</h3>
              <div class="border-2 border-dashed border-zinc-700 hover:border-amber-500 rounded-2xl p-8 text-center space-y-4 bg-zinc-950/50">
                <div class="text-4xl">📸 🎥</div>
                <button onClick={handleSimulateAiUpload} class="bg-amber-500 text-black font-bold px-4 py-2 rounded-xl text-xs">Simulate OCR Extraction</button>
              </div>
              {aiScanning && <div class="text-amber-400 text-xs">Parsing media...</div>}
              {extractedDraft && !aiScanning && (
                <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 space-y-3 text-xs">
                  <div class="text-amber-400 font-bold">Extracted Draft Review: {extractedDraft.customerName} ({extractedDraft.phoneNumber})</div>
                  <button onClick={handleConfirmAiDraft} class="bg-amber-500 text-black font-bold py-2 rounded-xl text-xs w-full">Confirm Order ✓</button>
                </div>
              )}
            </div>
          ) : (
            <form onSubmit={handleCreateManualOrder} class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 space-y-4 text-xs">
              <h3 class="font-heading font-bold text-xl text-white">Create Order Manually</h3>
              <div class="grid grid-cols-2 gap-3">
                <div><label class="text-zinc-400">Customer Name *</label><input type="text" required value={custName} onChange={e=>setCustName(e.target.value)} class="w-full bg-zinc-950 p-2.5 text-white border border-zinc-800 rounded-xl" /></div>
                <div><label class="text-zinc-400">Phone *</label><input type="text" required value={custPhone} onChange={e=>setCustPhone(e.target.value)} class="w-full bg-zinc-950 p-2.5 text-white border border-zinc-800 rounded-xl" /></div>
              </div>
              <button type="submit" class="bg-amber-500 text-black font-bold px-6 py-3 rounded-xl text-xs">Save Order</button>
            </form>
          )}
        </div>
      );
    }

    // --- HOLISTIC PRODUCT CRUD WITH DYNAMIC BRANDS, CUSTOM CATEGORIES & MULTI-IMAGE THUMBNAILS ---
    function OmsHolisticProductsTab({ products, saveProductsState, brandsList, categoriesList, addDynamicBrand, addDynamicCategory, onEditRow, onAdjustStock }) {
      const [showAddModal, setShowAddModal] = useState(false);
      const [newProdName, setNewProdName] = useState('');
      const [newProdBrand, setNewProdBrand] = useState(brandsList[0] || 'Soktas');
      const [customBrandInput, setCustomBrandInput] = useState('');
      const [isAddingBrand, setIsAddingBrand] = useState(false);

      const [newProdCategory, setNewProdCategory] = useState(categoriesList[0] || 'Shirting');
      const [customCategoryInput, setCustomCategoryInput] = useState('');
      const [isAddingCategory, setIsAddingCategory] = useState(false);

      const [newProdPrice, setNewProdPrice] = useState(800);
      const [newProdMrp, setNewProdMrp] = useState(1500);
      const [newProdStock, setNewProdStock] = useState(30);

      // Multi-Image Gallery State
      const [galleryUrls, setGalleryUrls] = useState([PRESET_FABRIC_IMAGES[0].url]);

      const handleAddImageThumbnail = () => {
        setGalleryUrls([...galleryUrls, PRESET_FABRIC_IMAGES[galleryUrls.length % PRESET_FABRIC_IMAGES.length].url]);
      };

      const handleRemoveImageThumbnail = (idx) => {
        if (galleryUrls.length <= 1) return alert("Must keep at least 1 image!");
        setGalleryUrls(galleryUrls.filter((_, i) => i !== idx));
      };

      const handleUpdateImageUrl = (idx, newUrl) => {
        setGalleryUrls(galleryUrls.map((url, i) => i === idx ? newUrl : url));
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        let targetBrand = newProdBrand;
        if (isAddingBrand && customBrandInput.trim()) {
          targetBrand = customBrandInput.trim();
          addDynamicBrand(targetBrand);
        }

        let targetCategory = newProdCategory;
        if (isAddingCategory && customCategoryInput.trim()) {
          targetCategory = customCategoryInput.trim();
          addDynamicCategory(targetCategory);
        }

        const created = {
          id: `prod-${products.length + 1}`,
          sku: `HT-NEW-${100 + products.length}`,
          name: newProdName,
          brand: targetBrand,
          category: targetCategory,
          fabricType: '100% Cotton',
          mrpPrice: Number(newProdMrp),
          sellingPrice: Number(newProdPrice),
          unit: 'pc',
          currentStock: Number(newProdStock),
          lowStockThreshold: 8,
          featuredInVideos: ['Video no 18'],
          imageUrl: galleryUrls[0] || PRESET_FABRIC_IMAGES[0].url,
          galleryImages: galleryUrls,
          isActive: true,
          description: 'New fabric inventory item.'
        };

        saveProductsState([created, ...products]);
        setShowAddModal(false);
      };

      const toggleProductActive = (productId) => {
        const updated = products.map(p => p.id === productId ? { ...p, isActive: !p.isActive } : p);
        saveProductsState(updated);
      };

      const duplicateProductRow = (product) => {
        const cloned = { ...product, id: `prod-${products.length + 1}`, sku: `${product.sku}-COPY`, name: `${product.name} (Variant)` };
        saveProductsState([cloned, ...products]);
      };

      const deleteProductRow = (productId) => {
        if (confirm("Archive this inventory row?")) saveProductsState(products.filter(p => p.id !== productId));
      };

      return (
        <div class="space-y-6">
          <div class="flex justify-between items-center">
            <div>
              <h3 class="font-heading font-bold text-xl text-white">Holistic Inventory Row Management</h3>
              <p class="text-xs text-zinc-400">Dynamic Brands, Custom Categories & Multi-Image Gallery Manager</p>
            </div>
            <button onClick={() => setShowAddModal(true)} class="bg-amber-500 text-black font-bold px-4 py-2.5 rounded-xl text-xs shadow">
              + Add New Fabric Item
            </button>
          </div>

          {/* ADD PRODUCT MODAL */}
          {showAddModal && (
            <form onSubmit={handleAddProduct} class="bg-zinc-900 border border-zinc-700 rounded-3xl p-6 space-y-4 max-w-2xl mx-auto shadow-2xl">
              <div class="flex justify-between border-b border-zinc-800 pb-3">
                <h4 class="font-heading font-bold text-lg text-white">Add New Fabric Inventory Row</h4>
                <button type="button" onClick={() => setShowAddModal(false)} class="text-zinc-400">✕</button>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                <div class="sm:col-span-2">
                  <label class="text-zinc-400">Fabric Name *</label>
                  <input type="text" required value={newProdName} onChange={e=>setNewProdName(e.target.value)} class="w-full bg-zinc-950 p-2.5 text-white border border-zinc-800 rounded-xl font-bold" />
                </div>

                {/* DYNAMIC BRAND CREATOR */}
                <div>
                  <label class="text-zinc-400">Brand</label>
                  {!isAddingBrand ? (
                    <div class="flex space-x-1.5 mt-1">
                      <select value={newProdBrand} onChange={e=>setNewProdBrand(e.target.value)} class="flex-1 bg-zinc-950 text-white border border-zinc-800 rounded-xl p-2.5">
                        {brandsList.map(b=><option key={b} value={b}>{b}</option>)}
                      </select>
                      <button type="button" onClick={() => setIsAddingBrand(true)} class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-1 rounded-xl text-xs font-bold">
                        + New
                      </button>
                    </div>
                  ) : (
                    <div class="flex space-x-1.5 mt-1">
                      <input type="text" placeholder="Type Brand..." value={customBrandInput} onChange={e=>setCustomBrandInput(e.target.value)} class="flex-1 bg-zinc-950 text-white border border-zinc-800 rounded-xl p-2 font-bold" />
                      <button type="button" onClick={() => setIsAddingBrand(false)} class="text-xs text-zinc-500">Cancel</button>
                    </div>
                  )}
                </div>

                {/* DYNAMIC CATEGORY CREATOR */}
                <div>
                  <label class="text-zinc-400">Category</label>
                  {!isAddingCategory ? (
                    <div class="flex space-x-1.5 mt-1">
                      <select value={newProdCategory} onChange={e=>setNewProdCategory(e.target.value)} class="flex-1 bg-zinc-950 text-white border border-zinc-800 rounded-xl p-2.5">
                        {categoriesList.map(c=><option key={c} value={c}>{c}</option>)}
                      </select>
                      <button type="button" onClick={() => setIsAddingCategory(true)} class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-1 rounded-xl text-xs font-bold">
                        + New
                      </button>
                    </div>
                  ) : (
                    <div class="flex space-x-1.5 mt-1">
                      <input type="text" placeholder="e.g. Suit Piece..." value={customCategoryInput} onChange={e=>setCustomCategoryInput(e.target.value)} class="flex-1 bg-zinc-950 text-white border border-zinc-800 rounded-xl p-2 font-bold" />
                      <button type="button" onClick={() => setIsAddingCategory(false)} class="text-xs text-zinc-500">Cancel</button>
                    </div>
                  )}
                </div>

                <div><label class="text-zinc-400">Selling Price (₹)</label><input type="number" required value={newProdPrice} onChange={e=>setNewProdPrice(e.target.value)} class="w-full bg-zinc-950 p-2.5 text-white border border-zinc-800 rounded-xl font-bold" /></div>
                <div><label class="text-zinc-400">MRP Price (₹)</label><input type="number" value={newProdMrp} onChange={e=>setNewProdMrp(e.target.value)} class="w-full bg-zinc-950 p-2.5 text-white border border-zinc-800 rounded-xl" /></div>
                <div><label class="text-zinc-400">Initial Stock</label><input type="number" value={newProdStock} onChange={e=>setNewProdStock(e.target.value)} class="w-full bg-zinc-950 p-2.5 text-white border border-zinc-800 rounded-xl" /></div>

                {/* MULTI-IMAGE THUMBNAIL MANAGER */}
                <div class="sm:col-span-2 space-y-3 border-t border-zinc-800 pt-3">
                  <div class="flex justify-between items-center">
                    <label class="text-amber-400 font-bold">Product Image Gallery Manager</label>
                    <button type="button" onClick={handleAddImageThumbnail} class="bg-zinc-800 text-amber-400 text-xs px-2.5 py-1 rounded-lg border border-zinc-700">
                      + Add Gallery Photo
                    </button>
                  </div>

                  <div class="space-y-2">
                    {galleryUrls.map((url, idx) => (
                      <div key={idx} class="flex space-x-2 items-center">
                        <img src={url} class="w-9 h-9 rounded-lg object-cover border border-zinc-700 shrink-0" />
                        <input type="text" value={url} onChange={e => handleUpdateImageUrl(idx, e.target.value)} class="flex-1 bg-zinc-950 p-2 text-white border border-zinc-800 rounded-xl font-mono text-[11px]" />
                        <button type="button" onClick={() => handleRemoveImageThumbnail(idx)} class="bg-red-950 text-red-400 font-bold px-2.5 py-1 rounded-lg border border-red-800">
                          ✕
                        </button>
                      </div>
                    ))}
                  </div>

                  <div class="text-[10px] text-zinc-500">Preset Gallery Quick Pick:</div>
                  <div class="flex space-x-2 overflow-x-auto pb-1 custom-scrollbar">
                    {PRESET_FABRIC_IMAGES.map((preset, i) => (
                      <img key={i} src={preset.url} onClick={() => setGalleryUrls([preset.url])} class="w-10 h-10 rounded-lg object-cover cursor-pointer border border-zinc-700" title={preset.name} />
                    ))}
                  </div>
                </div>
              </div>

              <div class="flex justify-end space-x-2 pt-2 border-t border-zinc-800">
                <button type="button" onClick={() => setShowAddModal(false)} class="px-4 py-2 bg-zinc-800 text-xs text-zinc-300 rounded-xl">Cancel</button>
                <button type="submit" class="px-6 py-2 bg-amber-500 text-black font-bold text-xs rounded-xl shadow">Save Fabric Item</button>
              </div>
            </form>
          )}

          {/* TABLE */}
          <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-zinc-950 text-zinc-400 font-semibold uppercase border-b border-zinc-800">
                <tr>
                  <th class="p-3">Photo</th>
                  <th class="p-3">Item / SKU</th>
                  <th class="p-3">Brand & Category</th>
                  <th class="p-3">Price</th>
                  <th class="p-3">Stock Level</th>
                  <th class="p-3">Visibility</th>
                  <th class="p-3 text-right">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-zinc-800 text-zinc-300">
                {products.map(p => (
                  <tr key={p.id} class={`hover:bg-zinc-850 ${!p.isActive ? 'opacity-50 bg-zinc-950/50' : ''}`}>
                    <td class="p-2.5"><img src={p.imageUrl} class="w-10 h-10 rounded-lg object-cover border border-zinc-800" /></td>
                    <td class="p-3 font-bold text-white">{p.name}<div class="text-[10px] text-zinc-500 font-mono">SKU: {p.sku}</div></td>
                    <td class="p-3"><span class="text-amber-400 font-semibold">{p.brand}</span><div class="text-[10px] text-zinc-500">{p.category}</div></td>
                    <td class="p-3 font-bold text-white">₹{p.sellingPrice}</td>
                    <td class="p-3">
                      <span class="font-bold">{p.currentStock} {p.unit}</span>
                      <button onClick={() => onAdjustStock(p)} class="ml-2 text-[10px] bg-zinc-800 border border-zinc-700 px-1.5 py-0.5 rounded">+/-</button>
                    </td>
                    <td class="p-3">
                      <button onClick={() => toggleProductActive(p.id)} class={`px-2.5 py-1 rounded text-[10px] font-bold ${p.isActive ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-zinc-800 text-zinc-400'}`}>
                        {p.isActive ? '👁️ Visible' : '🙈 Hidden'}
                      </button>
                    </td>
                    <td class="p-3 text-right space-x-1">
                      <button onClick={() => onEditRow(p)} class="bg-zinc-800 text-amber-400 px-2 py-1 rounded text-[10px]">✏️ Edit</button>
                      <button onClick={() => duplicateProductRow(p)} class="bg-zinc-800 text-zinc-300 px-2 py-1 rounded text-[10px]">📋 Clone</button>
                      <button onClick={() => deleteProductRow(p.id)} class="bg-red-950 text-red-400 px-2 py-1 rounded text-[10px]">🗑️</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- HOLISTIC EDIT MODAL (WITH MULTI-IMAGE THUMBNAIL MANAGER) ---
    function EditProductModal({ product, brandsList, categoriesList, addDynamicBrand, addDynamicCategory, onClose, onSave }) {
      const [form, setForm] = useState({ ...product });
      const [galleryUrls, setGalleryUrls] = useState(
        product.galleryImages && product.galleryImages.length > 0 ? product.galleryImages : [product.imageUrl]
      );
      const [newCustomBrand, setNewCustomBrand] = useState('');
      const [isAddingBrand, setIsAddingBrand] = useState(false);
      const [newCustomCat, setNewCustomCat] = useState('');
      const [isAddingCat, setIsAddingCat] = useState(false);

      const handleAddImageThumbnail = () => {
        setGalleryUrls([...galleryUrls, PRESET_FABRIC_IMAGES[galleryUrls.length % PRESET_FABRIC_IMAGES.length].url]);
      };

      const handleRemoveImageThumbnail = (idx) => {
        if (galleryUrls.length <= 1) return alert("Product must retain at least 1 image!");
        setGalleryUrls(galleryUrls.filter((_, i) => i !== idx));
      };

      const handleUpdateImageUrl = (idx, newUrl) => {
        setGalleryUrls(galleryUrls.map((url, i) => i === idx ? newUrl : url));
      };

      const handleSave = (e) => {
        e.preventDefault();
        let targetBrand = form.brand;
        if (isAddingBrand && newCustomBrand.trim()) {
          targetBrand = newCustomBrand.trim();
          addDynamicBrand(targetBrand);
        }

        let targetCat = form.category;
        if (isAddingCat && newCustomCat.trim()) {
          targetCat = newCustomCat.trim();
          addDynamicCategory(targetCat);
        }

        onSave({ 
          ...form, 
          brand: targetBrand, 
          category: targetCat, 
          imageUrl: galleryUrls[0], 
          galleryImages: galleryUrls 
        });
      };

      return (
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <form onSubmit={handleSave} class="bg-zinc-900 border border-zinc-700 rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
              <h3 class="font-heading font-bold text-lg text-white">Edit Inventory Item & Gallery</h3>
              <button type="button" onClick={onClose} class="text-zinc-400">✕</button>
            </div>

            <div class="grid grid-cols-2 gap-3 text-xs">
              <div class="col-span-2">
                <label class="text-zinc-400">Product Name</label>
                <input type="text" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} class="w-full bg-zinc-950 p-2.5 text-white border border-zinc-800 rounded-xl font-bold" />
              </div>

              <div>
                <label class="text-zinc-400">Brand</label>
                {!isAddingBrand ? (
                  <div class="flex space-x-1 mt-1">
                    <select value={form.brand} onChange={e => setForm({ ...form, brand: e.target.value })} class="flex-1 bg-zinc-950 text-white border border-zinc-800 rounded-xl p-2">
                      {brandsList.map(b=><option key={b} value={b}>{b}</option>)}
                    </select>
                    <button type="button" onClick={() => setIsAddingBrand(true)} class="bg-amber-500/20 text-amber-400 text-[10px] font-bold px-2 rounded-lg">+ Custom</button>
                  </div>
                ) : (
                  <div class="flex space-x-1 mt-1">
                    <input type="text" placeholder="Custom Brand..." value={newCustomBrand} onChange={e => setNewCustomBrand(e.target.value)} class="flex-1 bg-zinc-950 text-white border border-zinc-800 rounded-xl p-2 font-bold" />
                    <button type="button" onClick={() => setIsAddingBrand(false)} class="text-xs text-zinc-500">Cancel</button>
                  </div>
                )}
              </div>

              <div>
                <label class="text-zinc-400">Category</label>
                {!isAddingCat ? (
                  <div class="flex space-x-1 mt-1">
                    <select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })} class="flex-1 bg-zinc-950 text-white border border-zinc-800 rounded-xl p-2">
                      {categoriesList.map(c=><option key={c} value={c}>{c}</option>)}
                    </select>
                    <button type="button" onClick={() => setIsAddingCat(true)} class="bg-amber-500/20 text-amber-400 text-[10px] font-bold px-2 rounded-lg">+ Custom</button>
                  </div>
                ) : (
                  <div class="flex space-x-1 mt-1">
                    <input type="text" placeholder="e.g. Suit Piece..." value={newCustomCat} onChange={e => setNewCustomCat(e.target.value)} class="flex-1 bg-zinc-950 text-white border border-zinc-800 rounded-xl p-2 font-bold" />
                    <button type="button" onClick={() => setIsAddingCat(false)} class="text-xs text-zinc-500">Cancel</button>
                  </div>
                )}
              </div>

              <div><label class="text-zinc-400">Selling Price (₹)</label><input type="number" value={form.sellingPrice} onChange={e => setForm({ ...form, sellingPrice: Number(e.target.value) })} class="w-full bg-zinc-950 p-2.5 text-white border border-zinc-800 rounded-xl font-bold" /></div>
              <div><label class="text-zinc-400">MRP Price (₹)</label><input type="number" value={form.mrpPrice || ''} onChange={e => setForm({ ...form, mrpPrice: Number(e.target.value) })} class="w-full bg-zinc-950 p-2.5 text-white border border-zinc-800 rounded-xl" /></div>

              {/* MULTI-IMAGE THUMBNAIL MANAGER */}
              <div class="col-span-2 space-y-3 border-t border-zinc-800 pt-3">
                <div class="flex justify-between items-center">
                  <label class="text-amber-400 font-bold">Multi-Image Thumbnails (Upload / Edit / Remove)</label>
                  <button type="button" onClick={handleAddImageThumbnail} class="bg-zinc-800 text-amber-400 text-xs px-2.5 py-1 rounded-lg border border-zinc-700">
                    + Add Photo
                  </button>
                </div>

                <div class="space-y-2">
                  {galleryUrls.map((url, idx) => (
                    <div key={idx} class="flex space-x-2 items-center">
                      <img src={url} class="w-9 h-9 rounded-lg object-cover border border-zinc-700 shrink-0" />
                      <input type="text" value={url} onChange={e => handleUpdateImageUrl(idx, e.target.value)} class="flex-1 bg-zinc-950 p-2 text-white border border-zinc-800 rounded-xl font-mono text-[11px]" />
                      <button type="button" onClick={() => handleRemoveImageThumbnail(idx)} class="bg-red-950 text-red-400 font-bold px-2.5 py-1 rounded-lg border border-red-800">
                        ✕
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2 border-t border-zinc-800">
              <button type="button" onClick={onClose} class="px-4 py-2 bg-zinc-800 text-xs text-zinc-300 rounded-xl">Cancel</button>
              <button type="submit" class="px-6 py-2 bg-amber-500 text-black font-bold text-xs rounded-xl shadow">Save Changes</button>
            </div>
          </form>
        </div>
      );
    }

    function OmsWebsiteCustomizerTab({ storeSettings, saveSettingsState }) {
      const [formData, setFormData] = useState(storeSettings);
      const [savedToast, setSavedToast] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        saveSettingsState(formData);
        setSavedToast(true);
        setTimeout(() => setSavedToast(false), 2000);
      };

      return (
        <form onSubmit={handleSubmit} class="max-w-2xl mx-auto bg-zinc-900 border border-zinc-800 rounded-3xl p-6 space-y-4">
          <div class="flex justify-between border-b border-zinc-800 pb-3">
            <h3 class="font-heading font-bold text-xl text-white">DIY Website Customizer</h3>
            {savedToast && <span class="text-xs bg-emerald-950 text-emerald-400 px-3 py-1 rounded-full">Saved ✓</span>}
          </div>
          <div class="space-y-3 text-xs">
            <div><label class="text-zinc-400">Store Header Title</label><input type="text" value={formData.storeName} onChange={e=>setFormData({...formData, storeName:e.target.value})} class="w-full bg-zinc-950 p-2.5 text-white border border-zinc-800 rounded-xl font-bold" /></div>
            <div><label class="text-zinc-400">Announcement Bar Text</label><input type="text" value={formData.announcementBar} onChange={e=>setFormData({...formData, announcementBar:e.target.value})} class="w-full bg-zinc-950 p-2.5 text-white border border-zinc-800 rounded-xl" /></div>
            <div><label class="text-zinc-400">WhatsApp Phone Number</label><input type="text" value={formData.whatsappPhone} onChange={e=>setFormData({...formData, whatsappPhone:e.target.value})} class="w-full bg-zinc-950 p-2.5 text-white border border-zinc-800 rounded-xl font-mono" /></div>
          </div>
          <button type="submit" class="w-full bg-amber-500 text-black font-bold py-3 rounded-xl text-xs">Save Store Customizations</button>
        </form>
      );
    }

    function OmsCsvImportAndDedupeTab({ orders, saveOrdersState }) {
      const [parsedDiff, setParsedDiff] = useState(null);

      const handleParseCsvText = (csvContent) => {
        const lines = csvContent.split(/\r?\n/).filter(line => line.trim().length > 0);
        if (lines.length <= 1) return;
        const newItems = [];
        const startIdx = lines[0].toUpperCase().includes('NAME') ? 1 : 0;

        for (let i = startIdx; i < lines.length; i++) {
          const cols = lines[i].split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
          if (cols.length < 3) continue;

          const orderObj = {
            id: `HT-${1000 + orders.length + newItems.length + 1}`,
            ie: parseInt(cols[0]) || (orders.length + i),
            date: cols[3] || 'Today',
            customer: { name: cols[1] || 'Customer', phone: cols[2] || '', address: cols[7] || 'Local' },
            videoAttribution: cols[4] || 'Video no 18',
            fabricDescription: cols[5] || 'Fabric',
            quantity: cols[6] || '2 pc',
            totalAmount: parseInt(cols[8]?.replace(/[^0-9]/g, '')) || 1600,
            amountPaid: parseInt(cols[8]?.replace(/[^0-9]/g, '')) || 1600,
            balanceAmount: 0,
            paymentStatus: 'PAID',
            orderStatus: 'CONFIRMED'
          };
          newItems.push(orderObj);
        }
        setParsedDiff({ newItems, totalParsed: lines.length - startIdx });
      };

      return (
        <div class="space-y-4 bg-zinc-900 border border-zinc-800 p-6 rounded-3xl">
          <h3 class="font-heading font-bold text-xl text-white">Google Sheet CSV Import & Smart Deduplication</h3>
          <input type="file" accept=".csv" onChange={(e)=>{ const f=e.target.files[0]; if(f){ const r=new FileReader(); r.onload=evt=>handleParseCsvText(evt.target.result); r.readAsText(f); }}} class="text-xs" />
          {parsedDiff && (
            <div class="space-y-2 pt-2">
              <div class="text-xs font-bold text-emerald-400">Parsed {parsedDiff.newItems.length} new unique orders.</div>
              <button onClick={() => { saveOrdersState([...parsedDiff.newItems, ...orders]); setParsedDiff(null); alert("Synced to OMS!"); }} class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl text-xs">Confirm Sync</button>
            </div>
          )}
        </div>
      );
    }

    function OmsAnalyticsTab({ orders }) {
      const videoStats = useMemo(() => {
        const stats = {};
        orders.forEach(o => {
          const vid = o.videoAttribution || 'Other';
          if (!stats[vid]) stats[vid] = { count: 0, revenue: 0 };
          stats[vid].count += 1;
          stats[vid].revenue += (o.amountPaid || 0);
        });
        return Object.entries(stats).map(([video, data]) => ({ video, ...data }));
      }, [orders]);

      return (
        <div class="space-y-6">
          <h3 class="font-heading font-bold text-xl text-white">YouTube Video Revenue Attribution</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {videoStats.map(stat => (
              <div key={stat.video} class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl space-y-3">
                <div class="flex items-center space-x-2 text-red-400 font-heading font-bold">
                  <span>▶️</span><span>{stat.video}</span>
                </div>
                <div class="flex justify-between text-xs pt-2 border-t border-zinc-800">
                  <span class="text-zinc-400">Orders:</span><span class="font-bold text-white">{stat.count}</span>
                </div>
                <div class="flex justify-between text-xs">
                  <span class="text-zinc-400">Revenue:</span><span class="text-xl font-extrabold text-amber-400 font-heading">₹{stat.revenue.toLocaleString()}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function OrderDetailModal({ order, onClose, onUpdateStatus }) {
      return (
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex justify-end">
          <div class="bg-zinc-900 border-l border-zinc-800 max-w-md w-full h-full p-6 space-y-6 overflow-y-auto custom-scrollbar">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
              <div>
                <span class="text-xs text-amber-400 font-bold font-heading">{order.id}</span>
                <h3 class="font-heading font-bold text-xl text-white">{order.customer.name}</h3>
              </div>
              <button onClick={onClose} class="text-zinc-400 hover:text-white text-xl">✕</button>
            </div>
            <div class="space-y-4 text-xs">
              <div class="bg-zinc-950 p-4 rounded-xl space-y-2 border border-zinc-800">
                <div class="text-zinc-400 font-semibold uppercase">Customer Details</div>
                <div class="text-white font-medium">📞 {order.customer.phone}</div>
                <div class="text-zinc-300">📍 {order.customer.address}</div>
              </div>
              <div class="space-y-2 pt-2">
                <label class="text-zinc-400 font-semibold uppercase">Update Lifecycle Status:</label>
                <div class="grid grid-cols-2 gap-2">
                  {['CONFIRMED', 'PROCESSING', 'READY_TO_DISPATCH', 'DISPATCHED', 'DELIVERED'].map(st => (
                    <button key={st} onClick={() => onUpdateStatus(order.id, st)} class={`p-2 rounded-lg text-center font-bold text-[10px] border transition ${order.orderStatus === st ? 'bg-amber-500 text-black border-amber-400' : 'bg-zinc-800 text-zinc-300'}`}>
                      {st.replace(/_/g, ' ')}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function StockAdjustModal({ product, onClose, onAdjust }) {
      const [delta, setDelta] = useState(5);
      return (
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="bg-zinc-900 border border-zinc-700 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
            <h3 class="font-heading font-bold text-lg text-white">Adjust Stock Level</h3>
            <div class="flex items-center space-x-3 justify-center py-2">
              <button onClick={() => setDelta(d => d - 1)} class="w-10 h-10 bg-zinc-800 text-amber-400 font-bold text-lg rounded-xl">-</button>
              <input type="number" value={delta} onChange={e => setDelta(Number(e.target.value))} class="w-20 bg-zinc-950 p-2.5 text-center font-bold text-white border border-zinc-800 rounded-xl" />
              <button onClick={() => setDelta(d => d + 1)} class="w-10 h-10 bg-zinc-800 text-amber-400 font-bold text-lg rounded-xl">+</button>
            </div>
            <div class="flex space-x-2">
              <button onClick={() => onAdjust(product.id, -Math.abs(delta))} class="flex-1 bg-red-950 text-red-400 font-bold py-2.5 rounded-xl text-xs border border-red-800">- Remove {delta}</button>
              <button onClick={() => onAdjust(product.id, Math.abs(delta))} class="flex-1 bg-emerald-950 text-emerald-400 font-bold py-2.5 rounded-xl text-xs border border-emerald-800">+ Add {delta}</button>
            </div>
            <button onClick={onClose} class="w-full bg-zinc-800 text-zinc-400 py-2 rounded-xl text-xs font-medium">Cancel</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
